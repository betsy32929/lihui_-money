  function applyItemRuleToUnselectedRow(obj){
    if(!obj || isZeroBillRow(obj))return {matched:false,changed:false,invalid:false};
    if(String(obj.owner||'').trim())return {matched:false,changed:false,invalid:false};
    const rule=findItemShareRule(obj.item);
    if(!rule)return {matched:false,changed:false,invalid:false};
    if(!shareRuleIsValid(rule))return {matched:true,changed:false,invalid:true};
    const before=[String(obj.owner||''),String(obj.lihuiPct||''),String(obj.zhiweiPct||''),String(obj.payer||''),String(obj.shareVersion||''),String(obj.noMonthly||'')].join('｜');
    obj.owner=String(rule.owner||'').trim();
    if(shareLockedRow(obj)){clearShareForLockedOwner(obj);obj.noMonthly=!!rule.noMonthly;obj.updatedAt=new Date().toISOString();const afterLocked=[String(obj.owner||''),String(obj.lihuiPct||''),String(obj.zhiweiPct||''),String(obj.payer||''),String(obj.shareVersion||''),String(obj.noMonthly||'')].join('｜');return {matched:true,changed:before!==afterLocked,invalid:false};}
    obj.lihuiPct=cleanPct(rule.lihuiPct);
    obj.zhiweiPct=cleanPct(rule.zhiweiPct);
    obj.noMonthly=!!rule.noMonthly;
    obj.payer=rowLihuiPct(obj)>0 && rowZhiweiPct(obj)<=0?'麗卉負擔':(rowZhiweiPct(obj)>0 && rowLihuiPct(obj)<=0?'志偉負擔':'');
    obj.shareVersion='V213';
    obj.updatedAt=new Date().toISOString();
    const after=[String(obj.owner||''),String(obj.lihuiPct||''),String(obj.zhiweiPct||''),String(obj.payer||''),String(obj.shareVersion||''),String(obj.noMonthly||'')].join('｜');
    return {matched:true,changed:before!==after,invalid:false};
  }
  function applyShareRulesToCurrentMonthUnselected(){
    const inputMonth=normalizeRocMonthValue(doc.getElementById('belongMonth')?.value||'');
    const targetMonth=selectedMonth || (inputMonth.ok?inputMonth.value:'');
    if(!targetMonth){w.alert('目前沒有可更新的年月。');return;}
    let targetCount=0, matchedCount=0, changedCount=0, invalidCount=0;
    const changedIds=new Set();
    records.forEach(r=>{
      if(normalizeRocMonthValue(r.belongMonth||'').value!==targetMonth)return;
      if(isZeroBillRow(r) || String(r.owner||'').trim())return;
      targetCount++;
      const res=applyItemRuleToUnselectedRow(r);
      if(res.invalid)invalidCount++;
      if(res.matched)matchedCount++;
      if(res.changed){changedCount++;changedIds.add(r.id);}
    });
    rows.forEach(r=>{
      const rec=records.find(x=>x.id===r.id);
      if(rec){
        if(changedIds.has(r.id)){['owner','payer','lihuiPct','zhiweiPct','shareVersion','noMonthly','updatedAt'].forEach(k=>{r[k]=rec[k];});}
        return;
      }
      if(normalizeRocMonthValue(r.belongMonth||'').value!==targetMonth)return;
      if(isZeroBillRow(r) || String(r.owner||'').trim())return;
      targetCount++;
      const res=applyItemRuleToUnselectedRow(r);
      if(res.invalid)invalidCount++;
      if(res.matched)matchedCount++;
      if(res.changed)changedCount++;
    });
    if(!targetCount){w.alert(rocMonthText(targetMonth)+' 沒有「尚未選歸屬誰」的資料。');return;}
    if(!matchedCount){w.alert(rocMonthText(targetMonth)+' 尚未選歸屬誰的資料，目前沒有符合項目規則。');return;}
    saveRecords();
    saveDraft();
    render();
    const msg='已更新 '+rocMonthText(targetMonth)+' 未選資料 '+changedCount+' 筆；已選過歸屬誰的舊資料不變。'+(invalidCount?'（有 '+invalidCount+' 筆符合規則但規則比例不是100%，已略過）':'');
    setMsg(msg,true);
    w.alert(msg);
  }

  function fullCardDate(d,payDate){
    const s=String(d||'').trim();
    if(!s)return '';
    const direct=normalizeRocDateValue(s,'');
    if(direct.ok)return direct.value;
    const short=s.match(/^(\d{1,2})[\/.-](\d{1,2})$/);
    const pay=normalizeRocDateValue(payDate||'','');
    if(!short||!pay.ok)return s;
    let y=pay.y, m=+short[1], day=+short[2];
    if(m>pay.m && pay.m<=2)y-=1;
    const dt=new Date(y+1911,m-1,day);
    if(dt.getFullYear()!==y+1911||dt.getMonth()!==m-1||dt.getDate()!==day)return s;
    return y+'/'+m+'/'+day;
  }
  function compareMonthDesc(a,b){const ra=normalizeRocMonthValue(a),rb=normalizeRocMonthValue(b);return (rb.y*12+rb.m)-(ra.y*12+ra.m);}

  function lookupMainCardPayDate(monthRaw,bankRaw){
    const monthKey=cardPasteMonthKey(monthRaw);
    const bank=String(bankRaw||'').trim();
    if(!monthKey||!bank||!state||!state.months||!state.months[monthKey])return '';
    const label=cardPasteBankToItemLabel(bank);
    const m=state.months[monthKey];
    const sections=((m.personal||{}).sections||[]).filter(sec=>String(sec.title||'').includes('信用卡'));
    let found=null;
    sections.forEach(sec=>{(sec.items||[]).forEach(it=>{
      const itemLabel=String(it.label||'').trim();
      if(!found && (itemLabel===label || itemLabel.includes(bank) || label.includes(itemLabel)))found=it;
    });});
    return found?String(found.date||'').trim():'';
  }

  function parseAmount(s){const m=String(s||'').match(/-?\d[\d,，]*$/);return m?m[0].replace(/[，,]/g,''):'';}
  function shortMD(s,payDate){
    const m=String(s||'').match(/(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})|(\d{1,3})[\/.-](\d{1,2})[\/.-](\d{1,2})|(\d{1,2})[\/.-](\d{1,2})/);
    if(!m)return '';
    if(m[2])return (+m[2])+'/'+(+m[3]);
    if(m[5])return (+m[5])+'/'+(+m[6]);

  function normalizeOwnerAlias(s){

  function detectOwnerPrefix(line){
    let s=String(line||'').trim();
    if(!s)return {owner:'',line:s};
    const map={
      '麗卉個人':'麗卉個人','麗卉':'麗卉個人',
      '志偉個人':'志偉個人','志偉':'志偉個人',
      '小孩':'小孩','孩子':'小孩','兒子':'小孩',
      '家庭支出':'家庭支出','家庭':'家庭支出','家用':'家庭支出','大橋':'家庭支出','麗卉大橋':'家庭支出',
      '-':'-',
      '公司環姐':'公司環姐','公司環姊':'公司環姐','公司/環姊':'公司環姐','公司/環姐':'公司環姐','公司':'公司環姐','環姊':'公司環姐','環姐':'公司環姐',
      '大社':'大社','其他人':'其他人','其他':'其他人'
    };
    const aliases=Object.keys(map).sort((a,b)=>b.length-a.length);
    for(const a of aliases){
      const re=new RegExp('^\s*'+escReg(a)+'\s*[:：,，｜|\t ]+');

  function parseLine(line){
    const ownerInfo=detectOwnerPrefix(line);
    const owner=ownerInfo.owner||'';
    const clean=String(ownerInfo.line||'').replace(/	+/g,'	').trim();
    if(!clean)return null;
    const parts=clean.split(/	+/).map(x=>x.trim()).filter(x=>x!=='' );
    const dates=parts.filter(p=>/\d{1,4}[\/. -]\d{1,2}([\/. -]\d{1,2})?/.test(p.replace(/\s+/g,''))||/\d{1,4}[\/.-]\d{1,2}([\/.-]\d{1,2})?/.test(p));
    const nums=parts.filter(p=>/^-?\$?\d[\d,，]*$/.test(p.replace(/\s/g,'')));
    if(dates.length>=2 && nums.length>=1){
      const amount=nums[nums.length-1].replace(/[$,，\s]/g,'');
      const amountIdx=parts.findIndex(p=>p.replace(/[$,，\s]/g,'')===amount);
      let itemParts=parts.filter((p,idx)=>idx!==amountIdx && p!==dates[0] && p!==dates[1] && !/^\d+$/.test(p));
      let item=itemParts.join(' ').replace(/\s+/g,' ').trim();
      if(!item)item=parts.slice(2,Math.max(2,amountIdx)).join(' ').trim();
      return {owner,postDate:shortMD(dates[0]),spendDate:shortMD(dates[1]),item:item||'未命名項目',amount};
    }
    const m=clean.match(/(\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}|\d{1,3}[\/.-]\d{1,2}[\/.-]\d{1,2}|\d{1,2}[\/.-]\d{1,2})\s+(\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}|\d{1,3}[\/.-]\d{1,2}[\/.-]\d{1,2}|\d{1,2}[\/.-]\d{1,2})\s+(.+?)\s+(-?\d[\d,，]*)$/);
    if(m)return {owner,postDate:shortMD(m[1]),spendDate:shortMD(m[2]),item:m[3].trim(),amount:m[4].replace(/[，,]/g,'')};
    return null;
  }

  function warnIfDuplicateParsed(parsed){

    const dup=parsed.filter(r=>oldKeys.has(duplicateKey(r))).length;
    if(!dup)return true;

    const msg='偵測到 '+dup+' / '+parsed.length+' 筆資料的「入帳日期＋消費日期＋項目＋金額」已經存在。'+(ratio>=0.99?'\n幾乎整份都一樣，可能重複貼上。':'')+'\n\n仍要產生整理列表嗎？';

  function copyText(text,msg){
    const done=()=>setMsg(msg||'已複製。',true);
    const fail=()=>{
      setMsg('瀏覽器未允許自動複製，已開啟手動複製框。',false);
      w.prompt('瀏覽器未允許自動複製，請按 Ctrl+C 複製以下內容：', text);
    };
    if(w.navigator&&w.navigator.clipboard){w.navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done,fail));}
    else fallbackCopy(text,done,fail);
  }
  function fallbackCopy(text,done,fail){
    const ta=doc.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','readonly');
    ta.style.position='fixed';
    ta.style.left='-9999px';
    ta.style.top='0';
    doc.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok=false;
    try{ok=doc.execCommand('copy');}catch(e){ok=false;}
    ta.remove();
    if(ok)done&&done();else fail&&fail();
  }

  function editRecord(id,k,v){
    const rec=records.find(r=>r.id===id);
    if(!rec)return;
    rec[k]=(k==='amount')?String(v).replace(/[，,\s$]/g,''):v;
    if(k==='claimMode')rec[k]=String(v)==='no'?'no':'yes';
    if(k==='claimNote')rec[k]=String(v||'').trim();
    if(k==='lihuiPct'||k==='zhiweiPct')normalizeSharePair(rec,k);
    if(k==='owner'){rec.shareVersion='V213';if(shareLockedRow(rec))clearShareForLockedOwner(rec);else applyDefaultShareForOwner(rec);}
    if(k==='item'){
      rec[k]=cleanCardPasteItemValue(rec[k],rec);
      applyItemRuleToRow(rec,false);
    }
    if(['owner','lihuiPct','zhiweiPct','item'].includes(k))rememberRuleFromRow(rec);
    rec.updatedAt=new Date().toISOString();
    const draft=rows.find(r=>r.id===id);
    if(draft){
      ['owner','payer','lihuiPct','zhiweiPct','shareVersion','noMonthly','item','amount','note','claimMode','claimNote'].forEach(key=>{if(Object.prototype.hasOwnProperty.call(rec,key))draft[key]=rec[key];});
      draft.updatedAt=rec.updatedAt;
    }
    saveRecords();
    saveDraft();
    renderOverview();
    renderCurrentRows();
  }

function exportFileStamp(){
  const d=new Date();
  const roc=d.getFullYear()-1911;
  const pad=n=>String(n).padStart(2,'0');
  return `${roc}年${d.getMonth()+1}月${d.getDate()}日_${pad(d.getHours())}點${pad(d.getMinutes())}分`;
}
function safeReadLocalJSON(key,def){
  try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):def}catch(e){return def}
}
function safeWriteLocalJSON(key,val){
  try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}
}
let lastCardPasteRestoreCount=0;
function buildCardPasteBackup(){
  return {
    version:'V191',
    exportedAt:new Date().toISOString(),
    records:safeReadLocalJSON('lihui_card_paste_records_v4',[]),
    legacyRecords:safeReadLocalJSON('lihui_card_paste_records_v3',[]),
    claims:safeReadLocalJSON('lihui_card_paste_claims_v3',{}),
    currentRows:safeReadLocalJSON('lihui_card_paste_current_rows_v4',null),
    ownerOptions:safeReadLocalJSON('lihui_card_paste_owner_options_v1',null),
    shareRules:safeReadLocalJSON('lihui_card_paste_item_share_rules_v1',null)
  };
}
function extractCardPasteBackup(obj){
  if(!obj||typeof obj!=='object')return null;
  const candidates=[];
  const directKeys=['_cardPasteBackup','cardPasteBackup','cardPaste','_cardPaste','cardPasteData'];
  directKeys.forEach(k=>{if(obj[k]&&typeof obj[k]==='object')candidates.push(obj[k]);});
  if(Array.isArray(obj.cardPasteRecords))candidates.push({records:obj.cardPasteRecords});
  if(Array.isArray(obj._cardPasteRecords))candidates.push({records:obj._cardPasteRecords});
  if(Array.isArray(obj.lihui_card_paste_records_v4))candidates.push({records:obj.lihui_card_paste_records_v4});
  if(Array.isArray(obj.lihui_card_paste_records_v3))candidates.push({legacyRecords:obj.lihui_card_paste_records_v3});
  if(obj.localStorage&&typeof obj.localStorage==='object'){
    const ls=obj.localStorage;
    candidates.push({
      records:ls.lihui_card_paste_records_v4,
      legacyRecords:ls.lihui_card_paste_records_v3,
      claims:ls.lihui_card_paste_claims_v3,
      currentRows:ls.lihui_card_paste_current_rows_v4,
      ownerOptions:ls.lihui_card_paste_owner_options_v1,
      shareRules:ls.lihui_card_paste_item_share_rules_v1
    });
  }
  for(const raw of candidates){
    if(!raw||typeof raw!=='object')continue;
    const b=Object.assign({},raw);
    ['records','legacyRecords','ownerOptions','shareRules'].forEach(k=>{
      if(typeof b[k]==='string'){
        try{b[k]=JSON.parse(b[k]);}catch(e){}
      }
    });
    ['claims','currentRows'].forEach(k=>{
      if(typeof b[k]==='string'){
        try{b[k]=JSON.parse(b[k]);}catch(e){}
      }
    });
    if(Array.isArray(b.records)||Array.isArray(b.legacyRecords)||b.claims||b.currentRows||Array.isArray(b.ownerOptions)||Array.isArray(b.shareRules))return b;
  }
  return null;
}
function stripCardPasteBackupFields(obj){
  if(!obj||typeof obj!=='object')return obj;
  ['_cardPasteBackup','cardPasteBackup','cardPaste','_cardPaste','cardPasteData','cardPasteRecords','_cardPasteRecords','lihui_card_paste_records_v4','lihui_card_paste_records_v3','lihui_card_paste_item_share_rules_v1'].forEach(k=>{try{delete obj[k];}catch(e){}});
  return obj;
}
function restoreCardPasteBackup(obj){
  lastCardPasteRestoreCount=0;
  const b=extractCardPasteBackup(obj);
  if(!b||typeof b!=='object')return false;
  let restored=false;
  const recs=Array.isArray(b.records)?b.records:(Array.isArray(b.legacyRecords)?b.legacyRecords:null);
  if(Array.isArray(recs)){
    safeWriteLocalJSON('lihui_card_paste_records_v4',recs);
    lastCardPasteRestoreCount=recs.length;
    restored=true;
  }
  if(b.claims&&typeof b.claims==='object'){
    safeWriteLocalJSON('lihui_card_paste_claims_v3',b.claims);
    restored=true;
  }
  if(b.currentRows&&typeof b.currentRows==='object'){
    safeWriteLocalJSON('lihui_card_paste_current_rows_v4',b.currentRows);
    restored=true;
  }
  if(Array.isArray(b.ownerOptions)){
    safeWriteLocalJSON('lihui_card_paste_owner_options_v1',b.ownerOptions);
    restored=true;
  }
  return restored;
}
function buildSupabasePayload(){
  const payload=JSON.parse(JSON.stringify(state||{}));
  payload._cardPasteBackup=buildCardPasteBackup();
  return payload;
}
function applySupabasePayload(payload,remoteAt){
  const cloned=JSON.parse(JSON.stringify(payload||{}));
  restoreCardPasteBackup(cloned);
  state=stripCardPasteBackupFields(cloned);
  if(!state._meta)state._meta={};
  if(remoteAt){
    state._meta.localUpdatedAt=remoteAt;
    state._meta.cloudUpdatedAt=remoteAt;
    state._meta.lastLoadedCloudAt=remoteAt;
  }else if(!state._meta.localUpdatedAt){
    state._meta.localUpdatedAt=new Date().toISOString();
  }
  localStorage.setItem(STORE,JSON.stringify(state));
}
function exportJSON(){
  const payload=JSON.parse(JSON.stringify(state||{}));
  payload._cardPasteBackup=buildCardPasteBackup();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`麗卉帳款_${exportFileStamp()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSONFile(ev){
  const f=ev.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=JSON.parse(reader.result);
      const restoredCard=restoreCardPasteBackup(incoming);
      state=stripCardPasteBackupFields(incoming);
      normalizeLegacyCardLabels();
      ensureMonth();
      save();
      render();
      const cardMsg=restoredCard?`，並已還原另開視窗｜刷卡紀錄${lastCardPasteRestoreCount?` ${lastCardPasteRestoreCount} 筆`:''}`:'；此 JSON 沒有包含另開視窗｜刷卡紀錄備份';
      alert('已載入JSON'+cardMsg);
    }catch(e){
      alert('載入失敗：'+e.message);
    }finally{
      ev.target.value='';
    }
  };
  reader.readAsText(f,'utf-8');
}
function exportExcel(){const rows=[['月份','頁面','收支','項目/卡別/手機','日期1','日期2/期限','金額','分類/帳單月份','備註/說明']];const old=state.activeMonth;Object.keys(state.months).sort().forEach(mid=>{state.activeMonth=mid;const m=getMonth();m.personal.sections.forEach(sec=>sec.items.forEach(it=>{if(it.isCard){it.subItems.forEach(d=>rows.push([mid,'信用卡','支出',it.label,d.date1,d.date2,d.amount,d.category,d.desc+(d.note?'｜'+d.note:'')]))}else rows.push([mid,'麗卉每月帳款',it.type==='income'?'收入':'支出',it.label,'',it.date,it.amount,it.dateType,it.note])}));['postOffice','taiwanBank'].forEach(key=>(m[key].txs||[]).forEach(t=>rows.push([mid,key==='postOffice'?'郵局帳款':'台灣銀行帳款',t.type==='income'?'收入':'支出',t.item,'',t.date,t.amount,'',t.note])));Object.keys(m.mobile.numbers||{}).forEach(phone=>(m.mobile.numbers[phone].records||[]).forEach(r=>rows.push([mid,'項目紀錄','支出',phone,'',r.dueDate,r.amount,r.billMonth,(r.desc!==undefined?r.desc:(r.period+(r.note?'｜'+r.note:'')))])))});(getGlobalData().dadLiving?.rows||[]).forEach(r=>rows.push(['固定延續','項目紀錄-爸生活費','', '爸生活費$5000(匯款麗卉富邦)','',r.date,[r.laiya,r.liling,r.lihui].filter(Boolean).join(' / '),'麗雅/麗玲/麗卉',r.note||'']));state.activeMonth=old;if(window.XLSX){const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,'帳款明細');XLSX.writeFile(wb,`麗卉帳款_V60_${state.activeMonth}.xlsx`)}else{const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`麗卉帳款_V60_${state.activeMonth}.csv`;a.click();URL.revokeObjectURL(a.href)}}
window.addEventListener('load',()=>{load();render();loadSupabaseSettings();autoConnectSupabase()});

</script>
