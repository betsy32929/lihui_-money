<div class="wrap">
  <div class="topbar">

      <div>
        <h1>麗卉每月帳款</h1>
        
      </div>
      <div class="actions">
        <button class="act-btn act-add" onclick="addMonth()">＋新增月份</button>
        <button class="act-btn act-copy" onclick="copyCurrentMonth()">複製月份</button>
        <button class="act-btn act-del" onclick="deleteCurrentMonth()">刪除月份</button>
        <button class="act-btn act-fixed" onclick="toggleFixedAmountPanel()">固定金額設定</button>
        <button class="act-btn act-export" onclick="exportJSON()">匯出JSON</button>
        <button class="act-btn act-import" onclick="document.getElementById('jsonFile').click()">載入JSON</button>
        <input id="jsonFile" type="file" accept=".json,application/json" class="hidden" onchange="importJSONFile(event)">
        <button class="act-btn act-excel" onclick="exportExcel()">匯出EXCEL</button>
        <button class="act-btn act-printset" onclick="togglePrintBreakPanel()">項目換行設定</button>
        <button class="act-btn act-print" onclick="showPrintChoice()">列印</button>
      </div>
    </div>
    <div class="month-row">
      <span class="month-label">目前月份：<b id="monthText"></b></span>
      <div class="month-control">
        <button class="pillbtn month-nav prev" onclick="shiftMonth(-1)">← 上個月</button>
        <button class="pillbtn month-nav current" onclick="goCurrentMonth()">本月</button>
        <button class="pillbtn month-nav next" onclick="shiftMonth(1)">下個月 →</button>
        <select id="monthSelect" class="month-select" onchange="selectMonth(this.value)"></select>
      </div>
      <span class="save" id="saveText">已自動存檔</span>
    </div>
  </div>

  <div class="syncbar">
    <button class="sync-toggle" onclick="toggleSupabasePanel()">Supabase 設定</button>
    <span class="sync-pill off" id="syncStatus">未連線</span>
    <span class="sync-last" id="syncLast">最後同步時間：—</span>
    <span class="sync-msg" id="syncMsg"></span>
  </div>
  <div id="supabasePanel" class="supabase-panel hidden">
    <input id="supabaseUrl" placeholder="Project URL">
    <input id="supabaseKey" placeholder="Publishable Key / anon key">
    <button class="primary" onclick="connectSupabase()">連線</button>
    <button class="green" onclick="manualSyncSupabase()">立即同步</button>
    <button class="rose" onclick="disconnectSupabase()">中斷</button>
  </div>

  <div id="fixedAmountPanel" class="fixed-amount-panel hidden">

      <div>
        <h2>固定金額設定</h2>

      </div>

        <button onclick="applyFixedAmountsToCurrentMonth()">套用到本月空白金額</button>

      </div>
    </div>
    <div id="fixedAmountList" class="fixed-amount-list"></div>
  </div>

  <div class="tabs">

    <button class="tabcard" data-tab="bank" onclick="showTab('bank')"><h2>台灣銀行帳款</h2><p>大姊給款、特殊存款、零用金扣款</p><div class="moneyline" id="tabBank"></div></button>

}

function normalizePettySplitNote(note,amount){

function dataScore(obj){
  try{
    if(!obj||typeof obj!=='object')return 0;
    let score=0;
    const months=obj.months||{};
    score+=Object.keys(months).length*4;
    const countVal=v=>{if(v===null||v===undefined)return 0;return String(v).trim()?1:0};
    Object.values(months).forEach(m=>{
      ((m.personal||{}).sections||[]).forEach(sec=>{
        (sec.items||[]).forEach(it=>{
          score+=countVal(it.amount)+countVal(it.date)+countVal(it.note);
          if(it.isCard)score+=(it.subItems||[]).length*3;
        });
      });
      score+=((m.postOffice||{}).txs||[]).length*3;
      score+=((m.taiwanBank||{}).txs||[]).length*3;
      const p=((m.taiwanBank||{}).petty||{});
      score+=countVal(p.dajieStart)+countVal(p.erjieStart)+((p.dajieTxs||[]).length+(p.erjieTxs||[]).length)*3;
      const nums=((m.mobile||{}).numbers||{});
      Object.values(nums).forEach(n=>score+=((n||{}).records||[]).length*2);
    });
    const g=obj.globalData||{};
    score+=(((g.postOffice||{}).txs||[]).length+((g.taiwanBank||{}).txs||[]).length)*3;
    const gp=((g.taiwanBank||{}).petty||{});
    score+=countVal(gp.dajieStart)+countVal(gp.erjieStart)+((gp.dajieTxs||[]).length+(gp.erjieTxs||[]).length)*3;
    Object.values(((g.mobile||{}).numbers)||{}).forEach(n=>score+=((n||{}).records||[]).length*2);
    return score;
  }catch(e){return 0}
}

function findBestLocalAccountState(){
  const candidates=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key||key===SUPA_STORE||key===PRINT_LABEL_STORE)continue;
      const raw=localStorage.getItem(key);
      if(!raw||raw.length<50)continue;
      let obj;
      try{obj=JSON.parse(raw)}catch(e){continue}
      if(isAccountState(obj))candidates.push({key,score:dataScore(obj),time:newestTimeValue(obj),payload:obj});
    }
  }catch(e){}
  candidates.push(...readBackupCandidates());
  candidates.sort((a,b)=>(b.score-a.score)||(b.time-a.time));
  return candidates[0]||null;
}

function parseRocDateInput(input){
  let raw=String(input||'').trim();
  if(!raw)return {value:'',empty:true};
  let s=raw.replace(/[年月.\-]/g,'/').replace(/日/g,'').replace(/\/+/g,'/').replace(/^\//,'').replace(/\/$/,'');
  let y,mo,d,m;
  m=s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{
    m=s.match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m)return {value:'',error:true,raw};
    y=(new Date()).getFullYear()-1911;mo=+m[1];d=+m[2];
  }
  if(y>1911)y-=1911;

function sortDateNearToFarEntries(list){
  // 日期近到遠：較新的日期排前面；快速按鈕剛新增的資料固定在第一列方便輸入。
  return (list||[]).map((item,index)=>({item,index}))
    .sort((a,b)=>{

      if(b.item._newTop&&!a.item._newTop)return 1;
      const av=dateValue(a.item.date), bv=dateValue(b.item.date);
      if(av!==bv)return bv-av;

function prepareCopiedMonthData(sourceMonth,fromId,toId){
  const copied=JSON.parse(JSON.stringify(sourceMonth));

  // 複製月份規則：
  // 來源月份本身的資料清除，讓新月份可重新輸入。
  // 但「繳款日期不屬於來源月份」的資料保留，例如 1/24 已繳的 1~6 月管理費，
  // 從 115/03 複製到 115/04 時仍會保留，避免每月重複輸入，也避免零用金重複扣。
  (((copied.personal||{}).sections)||[]).forEach(sec=>{
    (sec.items||[]).forEach(it=>{
      const dp=dateParts(it.date||'');
      const keepBecauseNotSourceMonth=!!(it.date && dp && dp.monthId!==fromId);
      if(!keepBecauseNotSourceMonth){
        clearCopiedItemData(it);
      }else if(it.isCard){
        // 信用卡通常是當月帳單資料；即使日期非來源月份，也避免帶到新月份。
        clearCopiedItemData(it);
      }
    });
  });

  if(copied.notice)copied.notice={done:false,note:''};

  // 郵局帳款、台灣銀行帳款、零用金、項目紀錄是延續資料，
  // 複製月份時不清除，會完整保留到新月份。
  // 只有上方「麗卉每月帳款」的當月繳款資料會依規則清除/保留。

  // 固定預設金額：複製月份清除資料後，自動帶入固定金額；之後仍可手動修改。
  applyFixedDefaultAmounts(copied);

  // 爸爸生活費不進大姊/二姊零用金，應在台灣銀行帳戶手動輸入才算支出。
  normalizeDadLivingPettyRule(copied);

  return copied;
}

function monthsMentionedInDadLivingBankTx(t){
  // 臺灣銀行「麗雅給爸生活費」：用交易日期決定年份，用備註拆月份。
  // 例：日期115/5/1、備註「1-2月」＝115/1、115/2；若備註空白則用交易日期月份。
  const txMonth=txMonthIdFromDate(t);
  const txp=parseMonthId(txMonth);
  const text=[t&&t.note,t&&t.item].filter(Boolean).join('｜');
  const out=new Set();
  let m;
  const yearRangeRe=/(\d{2,3})\s*年?\s*(\d{1,2})\s*[-~～至到]\s*(\d{1,2})\s*月/g;
  while((m=yearRangeRe.exec(text))){
    let y=+m[1];if(y<300)y+=1911;let a=+m[2],b=+m[3];if(a>b){const tmp=a;a=b;b=tmp;}
    for(let mm=a;mm<=b;mm++)if(mm>=1&&mm<=12)out.add(`${y}-${String(mm).padStart(2,'0')}`);
  }
  const rangeRe=/(\d{1,2})\s*[-~～至到]\s*(\d{1,2})\s*月/g;
  while((m=rangeRe.exec(text))){
    if(!txp)continue;let a=+m[1],b=+m[2];if(a>b){const tmp=a;a=b;b=tmp;}
    for(let mm=a;mm<=b;mm++)if(mm>=1&&mm<=12)out.add(`${txp.year}-${String(mm).padStart(2,'0')}`);
  }
  const multiMonthRe=/((?:\d{1,2}\s*[、,，.．]\s*)+\d{1,2})\s*月/g;
  while((m=multiMonthRe.exec(text))){
    if(!txp)continue;String(m[1]).split(/[、,，.．]/).forEach(x=>{const mm=+String(x).trim();if(mm>=1&&mm<=12)out.add(`${txp.year}-${String(mm).padStart(2,'0')}`);});
  }
  const rocDateRe=/(\d{2,3})\/(\d{1,2})(?:\/(\d{1,2}))?/g;
  while((m=rocDateRe.exec(text))){const id=monthIdFromRoc(m[1],m[2]);if(id)out.add(id);}
  const rocYearMonthRe=/(\d{2,3})\s*年\s*(\d{1,2})\s*月/g;
  while((m=rocYearMonthRe.exec(text))){const id=monthIdFromRoc(m[1],m[2]);if(id)out.add(id);}
  const oneRe=/(?:^|[^\d])(\d{1,2})\s*月/g;
  while((m=oneRe.exec(text))){if(txp){const mm=+m[1];if(mm>=1&&mm<=12)out.add(`${txp.year}-${String(mm).padStart(2,'0')}`);}}
  if(!out.size&&txMonth)out.add(txMonth);
  return Array.from(out);
}

function todayRocText(){const d=new Date();return `${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()} 星期${'日一二三四五六'[d.getDay()]}`;}
function homeStatCard(cls,title,count,sub){return `<div class="home-stat-card ${cls||''}"><div class="home-stat-name">${esc(title)}</div><div class="home-stat-line"><div class="home-stat-count ${count?'':'ok'}">${count||'OK'}</div><div class="home-stat-text">${esc(sub)}</div></div></div>`;}
function homeMissingCard(group,name,months,rule,action){return `<div class="home-missing-card"><div class="home-missing-top"><span class="home-missing-group">${esc(group)}</span><button class="home-go warn" onclick='${action}'>前往</button></div><div class="home-missing-title">${esc(name)}</div><div class="home-missing-month">缺：${esc(reminderMonthText(months))}</div><div class="home-missing-rule">${esc(rule)}</div></div>`;}
function homeMonthListText(months){
  return (months||[]).map(v=>/^\d{4}-\d{1,2}$/.test(String(v))?monthIdToRocShort(v):String(v)).join('、');
}

  document.getElementById('main').innerHTML=`<div class="panel home-reminder-panel">

function renderNotice(){const m=getMonth();const missing=allItems().filter(it=>!it.isCard && !num(it.amount) && it.label!=='高雄翠屏路房貸（20號自動轉帳）').map(it=>it.label);const day=new Date().getDate();const remind=day<=15&&!m.notice.done;document.getElementById('main').innerHTML=`<div class="panel alt"><div class="panel-title"><div><h2>公告欄 / 每月提醒｜${rocMonthLabel(state.activeMonth)}</h2><div class="hint">首頁先當提醒區用：每月15日前輸入完帳款，並檢查固定項目有沒有漏填。</div></div><label class="checkline"><input type="checkbox" ${m.notice.done?'checked':''} onchange="getMonth().notice.done=this.checked;save();render()">本月帳款已輸入完成</label></div>${remind?'<div class="warnline">提醒：每月15日前要輸入完帳款，目前本月尚未勾選完成。</div>':'<div class="okline">本月提醒狀態：已完成或已超過提醒日前。</div>'}<div class="notice-grid"><div class="noticebox"><h3>待檢查項目</h3>${missing.length?`<ul class="notice-list">${missing.slice(0,18).map(x=>`<li>${esc(x)}</li>`).join('')}${missing.length>18?`<li>還有 ${missing.length-18} 筆...</li>`:''}</ul>`:'<div class="okline">固定清單目前沒有明顯漏填金額。</div>'}</div><div class="noticebox"><h3>公告/備忘</h3><textarea rows="9" placeholder="這裡可寫每月注意事項，會自動記住。" oninput="getMonth().notice.note=this.value;save()">${esc(m.notice.note)}</textarea></div></div></div>`}
function renderPersonal(){const m=getMonth();document.getElementById('main').innerHTML=`<div class="panel"><div class="panel-title"><div><h2>麗卉每月帳款｜${rocMonthLabel(state.activeMonth)}</h2></div><div class="tools"><button class="softbtn blue" onclick="syncAllMobileToPersonal(true)">從項目紀錄帶入</button></div></div>${m.personal.sections.map(renderSection).join('')}</div>`;renderCardPreview();applyMobileHints()}
function renderSection(sec,secIdx){
  const extra=sec.title==='信用卡'?renderCardPaste():'';
  const cardTools=sec.title==='信用卡'
    ? `<button class="tinybtn card-open-all" onclick="expandAllCardDetails(${secIdx})">全部明細展開</button><button class="tinybtn card-clear-all" onclick="clearAllCardDetails()">清除資料</button>`
    : '';
  return `<div class="section"><div class="section-head"><div><h3>${esc(sec.title)}</h3></div><div class="section-tools">${cardTools}<button class="tinybtn" onclick="addPersonalItem(${secIdx})">＋新增項目</button></div></div>${extra}${sec.items.map((it,idx)=>it.isCard?renderCardRow(it,secIdx,idx):renderFixedRow(it,secIdx,idx)).join('')}</div>`
}
function renderFixedRow(it,secIdx,idx){const split=!isDadLivingItemLabel(it.label)&&!String(it.label||'').includes('高雄翠屏路大樓管理費')&&(it.label.includes('大社')||it.label.includes('爸爸')||it.label.includes('翠屏')||it.label.includes('長照'));const fixedAmt=getFixedDefaultAmount(it.label);return `<div class="fixed-row normalrow"><div><div class="tiny">項目${fixedAmt?`｜固定預設${fmt(fixedAmt,true)}`:''}</div><input class="labelcell" value="${esc(it.label)}" oninput="setItem(${secIdx},${idx},'label',this.value)"></div><div><div class="tiny">金額</div><input inputmode="numeric" class="amountinp" value="${esc(it.amount)}" oninput="this.value=moneyOnly(this.value);setItem(${secIdx},${idx},'amount',this.value)" placeholder="0"></div><div><div class="tiny">${esc(it.dateType)}</div><input value="${esc(it.date)}" onchange="this.value=normalizeDateInput(this);setItem(${secIdx},${idx},'date',this.value)" placeholder="115/5/8"></div><div><div class="tiny">備註</div><input value="${esc(it.note)}" oninput="setItem(${secIdx},${idx},'note',this.value)" placeholder="備註事項"></div><div>${split?`<div class="tiny">零用金</div><select onchange="setItem(${secIdx},${idx},'splitMode',this.value)"><option value="none" ${it.splitMode==='none'?'selected':''}>不扣</option><option value="2" ${it.splitMode==='2'?'selected':''}>/2</option><option value="3" ${it.splitMode==='3'?'selected':''}>/3</option><option value="dadLiving" ${it.splitMode==='dadLiving'?'selected':''}>爸生活費規則</option></select>`:'<div class="tiny">&nbsp;</div><div class="compact-empty"></div>'}</div><div><div class="tiny">&nbsp;</div><div class="row-actions"><button class="iconbtn keep" onclick="clearPersonalItemData(${secIdx},${idx})">清</button><button class="iconbtn del" onclick="deletePersonalItem(${secIdx},${idx})">刪</button></div></div></div>`}
function renderCardRow(it,secIdx,idx){const sum=it.subItems.reduce((s,d)=>s+numSigned(d.amount),0);const hidden=it.noBill||it.detailsHidden;return `<div class="fixed-row cardrow"><div><div class="tiny">項目</div><input class="labelcell" value="${esc(it.label)}" oninput="setItem(${secIdx},${idx},'label',this.value)"></div><div><div class="tiny">小計</div><input class="amountinp ${sum<0?'signedNeg':''}" value="${sum?fmtSigned(sum,true):''}" readonly placeholder="-"></div><div><div class="tiny" title="${esc(it.dueInfo)}">${esc(it.dateType)}</div><input value="${esc(it.date)}" onchange="this.value=normalizeDateInput(this);setItem(${secIdx},${idx},'date',this.value)" placeholder="115/5/18" title="${esc(it.dueInfo)}"></div><div><div class="tiny">帳單</div><label class="checkline"><input type="checkbox" ${it.noBill?'checked':''} onchange="setItem(${secIdx},${idx},'noBill',this.checked);render()">無帳單</label></div><div><div class="tiny">備註</div><input value="${esc(it.note)}" oninput="setItem(${secIdx},${idx},'note',this.value)" placeholder="飲食1250+交通50"></div><div><div class="tiny">操作</div><div class="row-actions"><button class="iconbtn" onclick="addManualCardDetail(${secIdx},${idx})">＋明細</button>${it.noBill?'':`<button class="iconbtn edit" onclick="toggleCardDetails(${secIdx},${idx})">${hidden?'明細展開':'收起明細'}</button>`}<button class="iconbtn keep" onclick="clearPersonalItemData(${secIdx},${idx})">清</button><button class="iconbtn del" onclick="deletePersonalItem(${secIdx},${idx})">刪</button></div></div>${hidden?'':renderCardDetails(it,secIdx,idx)}</div>`}
function renderCardDetails(it,secIdx,idx){if(!it.subItems.length)return `<div class="details"><div class="empty">尚無信用卡明細</div></div>`;return `<div class="details"><div class="detail-head"><div>消費日</div><div>入帳日</div><div>說明</div><div>分類</div><div>金額</div><div>備註</div><div></div></div>${it.subItems.map((d,di)=>`<div class="detail-row"><input value="${esc(d.date1)}" onchange="this.value=normalizeDateInput(this);setCardDetail(${secIdx},${idx},${di},'date1',this.value)"><input value="${esc(d.date2)}" onchange="this.value=normalizeDateInput(this);setCardDetail(${secIdx},${idx},${di},'date2',this.value)"><input value="${esc(d.desc)}" oninput="setCardDetail(${secIdx},${idx},${di},'desc',this.value)"><input value="${esc(d.category)}" oninput="setCardDetail(${secIdx},${idx},${di},'category',this.value)"><input inputmode="numeric" class="num ${numSigned(d.amount)<0?'signedNeg':''}" value="${esc(d.amount)}" oninput="this.value=signedMoney(this.value);setCardDetail(${secIdx},${idx},${di},'amount',this.value)"><input value="${esc(d.note)}" oninput="setCardDetail(${secIdx},${idx},${di},'note',this.value)"><button class="iconbtn del" onclick="delCardDetail(${secIdx},${idx},${di})">刪</button></div>`).join('')}</div>`}
function savePersonalTemplate(){
  const sections=getMonth().personal.sections.map(sec=>({title:sec.title,tone:sec.tone,items:sec.items.map(it=>({label:it.label,dateType:it.dateType,type:it.type,isCard:!!it.isCard,dueInfo:it.dueInfo||'',splitMode:it.splitMode||'none'}))}));
  state.personalTemplate=sections;
  save();
  alert('已把本月項目清單設為以後新月份的預設清單。\n已經建立的月份不會被自動改掉。');
}
function addPersonalItem(secIdx){const sec=getMonth().personal.sections[secIdx];const name=prompt(sec.title==='信用卡'?'新增信用卡/銀行名稱：':'新增項目名稱：');if(!name)return;let dateType=sec.title==='信用卡'?'繳款日期':(sec.title.includes('收入')?'領款日期':'繳款日期');const custom=prompt('日期欄名稱：',dateType);if(custom)dateType=custom;const type=sec.title.includes('收入')?'income':'expense';sec.items.push(makeItem(name.trim(),dateType,type,{isCard:sec.title==='信用卡'}));save();render()}
function deletePersonalItem(si,ii){const it=getMonth().personal.sections[si].items[ii];if(!confirm('刪除項目「'+it.label+'」？'))return;getMonth().personal.sections[si].items.splice(ii,1);save();render()}
function clearPersonalItemData(si,ii){
  const it=getMonth().personal.sections[si].items[ii];
  if(!it)return;
  if(!confirm('清除「'+it.label+'」這一列資料？\n會保留項目名稱、日期欄名稱、零用金分攤設定，只清除日期/備註/信用卡明細；固定預設金額會保留。'))return;
  const fixed=getFixedDefaultAmount(it.label);
  it.amount=fixed||'';
  it.date='';
  it.note='';
  it._autoNote='';
  if(it.isCard){
    it.subItems=[];
    it.noBill=false;
    it.detailsHidden=true;
  }
  save();
  render();
}
function toggleCardDetails(si,ii){const it=getMonth().personal.sections[si].items[ii];it.detailsHidden=!it.detailsHidden;save();render()}
function expandAllCardDetails(secIdx){
  const sec=getMonth().personal.sections[secIdx];
  if(!sec)return;
  (sec.items||[]).forEach(it=>{
    if(it.isCard && !it.noBill){
      it.detailsHidden=false;
    }
  });
  save();
  render();
}
function setItem(si,ii,field,val){getMonth().personal.sections[si].items[ii][field]=val;save();if(field==='splitMode')render()}
function addManualCardDetail(si,ii){const it=getMonth().personal.sections[si].items[ii];it.subItems.push({date1:'',date2:'',desc:'',category:'',amount:'',note:''});it.detailsHidden=false;save();render()}
function cardCategorySummary(it){const map={};(it.subItems||[]).forEach(d=>{const c=(d.category||'未分類').trim()||'未分類';const a=numSigned(d.amount);if(a)map[c]=(map[c]||0)+a});return Object.entries(map).map(([k,v])=>`${k}${signedPlain(v)}`).join('+')}
function updateCardNoteFromDetails(it,force=false){const s=cardCategorySummary(it);if(force||!it.note||it.note===it._autoNote){it.note=s;it._autoNote=s}}
function setCardDetail(si,ii,di,field,val){const it=getMonth().personal.sections[si].items[ii];const d=it.subItems[di];d[field]=val;if(field==='category'&&d.desc)state.categoryMemory[normKey(d.desc)]=val;if(['category','amount','desc'].includes(field))updateCardNoteFromDetails(it);save()}
function delCardDetail(si,ii,di){if(!confirm('刪除此信用卡明細？'))return;const it=getMonth().personal.sections[si].items[ii];it.subItems.splice(di,1);updateCardNoteFromDetails(it,true);save();render()}
function renderCardPaste(){return `<div class="pastebox"><h4>信用卡整批貼上</h4><textarea id="cardBulkText" placeholder="例如：
台新1120514	2026/2/25	2026/2/26	街口電支－台灣電力股份有限公司TAIPEI	2,288
2026/2/25	2026/2/26	刷退回饋	-20"></textarea><div class="paste-tools"><span class="compact-note">判斷不到信用卡時：自動放到「未分類信用卡」</span><button class="softbtn purple" onclick="analyzeCardBulk()">產生預覽</button><button class="softbtn blue" onclick="refreshCardPreview()">更新預覽</button><button class="softbtn green" onclick="confirmCardPreview()">確認新增</button><button class="softbtn rose" onclick="tempCardPreview=[];renderCardPreview()">清除預覽</button><button class="softbtn rose danger-outline" onclick="clearAllCardDetails()">清除信用卡明細</button></div><div id="cardPreviewBox"></div></div>`}
function normKey(s){return String(s||'').toLowerCase().replace(/[\s\-－_＿，,。\.、:：()（）\[\]]/g,'').slice(0,50)}
function guessCard(text,fallback){
  // 判斷順序很重要：先判斷「志偉聯邦銀行」，剩下只要有「聯邦」就歸到「麗卉聯邦」
  for(const [name,rx] of cardAliases){if(rx.test(text))return name}
  return fallback||'未分類信用卡'
}
function inferCategory(desc){
  const key=normKey(desc);
  if(state.categoryMemory[key])return state.categoryMemory[key];
  let best={score:0,cat:''};
  for(const k in state.categoryMemory){
    if(!k)continue;
    if((key.includes(k)&&k.length>=4)||(k.includes(key)&&key.length>=4))return state.categoryMemory[k];
    const set=new Set(k.split(''));
    let hit=0; key.split('').forEach(ch=>{if(set.has(ch))hit++});
    const score=hit/Math.max(key.length,k.length,1);
    if(score>best.score){best={score,cat:state.categoryMemory[k]}}
  }
  if(best.score>=0.62)return best.cat;
  const rules=[[/台電|電力|水費|瓦斯|天然氣|中華電信|遠傳|台灣大哥大|電信/i,'水電電話費'],[/丁丁|尿布|奶粉|小孩|藥局|藥妝/i,'小孩用品/藥局'],[/全聯|家樂福|愛買|大潤發|超市|市場/i,'生活用品/超市'],[/街口|悠遊付|linepay|全支付|橘子支付/i,'行動支付'],[/中油|台塑|加油|停車|etag/i,'交通/停車'],[/早餐|午餐|晚餐|便當|麥當勞|肯德基|星巴克|咖啡|餐/i,'外食'],[/momo|蝦皮|pchome|博客來|網購/i,'網購'],[/保險|健保|勞保/i,'保險/稅費'],[/三井|百貨|屈臣氏|寶雅/i,'購物']];
  for(const [rx,cat] of rules){if(rx.test(desc))return cat}
  return '未分類'
}
function parseCardLine(line,fallback){let raw=line.trim();if(!raw)return null;const parts=raw.split(/\t+/).map(x=>x.trim()).filter(Boolean);let card='',date1='',date2='',desc='',amount='';if(parts.length>=5){card=guessCard(parts[0],fallback);date1=normalizeDate(parts[1]);date2=normalizeDate(parts[2]);amount=signedMoney(parts[parts.length-1]);desc=parts.slice(3,-1).join(' ')}else if(parts.length===4){card=guessCard(raw,fallback);date1=normalizeDate(parts[0]);date2=normalizeDate(parts[1]);desc=parts[2];amount=signedMoney(parts[3])}else{const amtMatch=raw.match(/(-?\d[\d,]*)\s*$/);if(!amtMatch)return null;amount=signedMoney(amtMatch[1]);raw=raw.slice(0,amtMatch.index).trim();const dates=raw.match(/(?:\d{2,4}[\/\-.])?\d{1,2}[\/\-.]\d{1,2}/g)||[];date1=normalizeDate(dates[0]||'');date2=normalizeDate(dates[1]||'');desc=raw;dates.forEach(d=>{desc=desc.replace(d,'')});card=guessCard(raw,fallback)}if(!amount)return null;return {card,date1,date2,desc:desc.trim()||raw,category:inferCategory(desc),amount,note:''}}
function analyzeCardBulk(){const txt=document.getElementById('cardBulkText').value||'';const fallback='未分類信用卡';tempCardPreview=txt.split(/\r?\n/).map(l=>parseCardLine(l,fallback)).filter(Boolean);renderCardPreview()}

function clearAllCardDetails(){
  if(!confirm('確定清除本月所有信用卡明細？\\n清除後可重新整批貼上匯入。\\n\\n會清除：各信用卡明細、小計備註、自動備註；無帳單勾選不會被取消。'))return;
  const cardSec=getMonth().personal.sections.find(sec=>sec.title==='信用卡');
  if(!cardSec)return;
  (cardSec.items||[]).forEach(it=>{
    if(it.isCard){
      it.subItems=[];
      it.amount='';
      it.note='';
      it._autoNote='';
      it.detailsHidden=true;
    }
  });
  tempCardPreview=[];
  save();
  render();

function flashCopyButton(btn,success=true){
  if(!btn)return;
  const old=btn.textContent;
  btn.textContent=success?'已複':'失敗';

  setTimeout(()=>{btn.textContent=old||'複';btn.classList.remove('done');btn.disabled=false;},900);

function tryTextareaCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.left='12px';
  ta.style.top='12px';
  ta.style.width='2px';
  ta.style.height='2px';
  ta.style.opacity='0';
  ta.style.zIndex='-1';
  document.body.appendChild(ta);
  ta.focus({preventScroll:true});
  ta.select();
  ta.setSelectionRange(0,ta.value.length);
  let ok=false;
  try{ok=document.execCommand('copy')}catch(e){ok=false}
  document.body.removeChild(ta);
  return !!ok;
}

function copyRowsForExcel(rows,label,btn){
  if(!confirmAction('確定複製「'+label+'」的 EXCEL 格式？'))return;
  const text=rowsToTsv(rows);
  let ok=tryTextareaCopy(text);
  const finish=(success)=>{
    setCopyFeedback(label,success);
    flashCopyButton(btn,success);
    if(!success)showManualCopyBox(text,label);
  };
  if(ok){
    finish(true);
    return;
  }
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>finish(true)).catch(()=>finish(false));
  }else{
    finish(false);
  }
}
function ledgerBalanceMap(txs){
  const map={};
  let balance=0;
  (txs||[]).map((item,index)=>({item,index}))
    .sort((a,b)=>{
      const av=dateValue(a.item.date), bv=dateValue(b.item.date);
      if(av!==bv)return av-bv;
      return a.index-b.index;
    })
    .forEach(({item:t,index:i})=>{
      const amount=num(t.amount);
      balance += t.type==='income'?amount:-amount;
      map[i]=balance;
    });
  return map;
}

  if(!tx)return;
  const v=moneyOnly(el?.value||'');
  if(el)el.value=v;
  tx.type=type;
  tx.amount=v;
  if(el){
    const tr=el.closest('tr');
    const other=tr?.querySelector(type==='income'?'.ledger-expense-input':'.ledger-income-input');
    if(other)other.value='';
  }
  save();
}
function ledgerExcelRows(kind){
  const txs=getGlobalData()[kind].txs||[];
  const balances=ledgerBalanceMap(txs);
  const rows=[['日期','收入','支出','餘額','備註']];
  sortDateNearToFarEntries(txs).forEach(({item:t,index:i})=>{
    const amount=num(t.amount);
    const income=t.type==='income'?amount:'';
    const expense=t.type==='expense'?amount:'';
    const note=[t.item||'',t.note||''].filter(Boolean).join('｜');
    rows.push([t.date||'',income,expense,balances[i]||0,note]);
  });
  return rows;
}

function pettyBalanceMap(who,rows){

  let balance=start;
  (rows||[]).slice().sort((a,b)=>{
    const av=dateValue(a.date), bv=dateValue(b.date);
    if(av!==bv)return av-bv;
    return 0;

  });

function calcPetty(){
  const petty=getGlobalData().taiwanBank.petty;
  const dajieRows=[],erjieRows=[];let dajie=numSigned(petty.dajieStart),erjie=numSigned(petty.erjieStart);
  function add(rows,sign,date,item,amount,note='',manualIndex=null,type='auto',originalAmount=null){rows.push({sign,date,item,amount,note,manualIndex,type,originalAmount:originalAmount||amount});return amount}
  (petty.dajieTxs||[]).forEach((t,i)=>{const a=num(t.amount); if(!a)return; if(t.type==='income')dajie+=add(dajieRows,'收入',t.date,t.item,a,t.note,i,'manual',a); else dajie-=add(dajieRows,'扣款',t.date,t.item,a,t.note,i,'manual',a)});
  (petty.erjieTxs||[]).forEach((t,i)=>{const a=num(t.amount); if(!a)return; if(t.type==='income')erjie+=add(erjieRows,'收入',t.date,t.item,a,t.note,i,'manual',a); else erjie-=add(erjieRows,'扣款',t.date,t.item,a,t.note,i,'manual',a)});
  const seenAutoPetty=new Set();
  Object.keys(state.months||{}).sort().forEach(monthId=>{
    const month=state.months[monthId];
    const homeSec=month?.personal?.sections?.find(sec=>sec.title==='大社支出');
    (homeSec?.items||[]).forEach(it=>{
      if(isDadLivingItemLabel(it.label))return; // 爸爸生活費不扣大姊/二姊零用金，改由台灣銀行帳戶手動輸入
      if(String(it.label||'').includes('高雄翠屏路大樓管理費'))return; // 高雄翠屏路大樓管理費不列入大姊零用金扣款
      const a=num(it.amount);if(!a)return;const dt=it.date||'';
      const dp=dateParts(dt); if(!dp)return;
      const key=[it.label,dt,a,it.splitMode].join('|');
      if(seenAutoPetty.has(key))return;
      seenAutoPetty.add(key);

      if(it.splitMode==='2'){const v=Math.round(a/2);dajie-=add(dajieRows,'扣款',dt,it.label,v,pettyPlainAmount(a)+'分攤/2',null,'auto',a)}
      else if(it.splitMode==='3'){const v=Math.round(a/3);dajie-=add(dajieRows,'扣款',dt,it.label,v,pettyPlainAmount(a)+'分攤/3',null,'auto',a);erjie-=add(erjieRows,'扣款',dt,it.label,v,pettyPlainAmount(a)+'分攤/3',null,'auto',a)}
    });
  });
  return {dajieRows,erjieRows,dajieEnd:dajie,erjieEnd:erjie}
}

function getDadLivingMissingMonths(rows,startMonth){
  const start=parseMonthId(startMonth)||parseMonthId(DAD_LIVING_START_MONTH);
  const end=parseMonthId(defaultMonth)||parseMonthId(monthIdFromDate(new Date()));
  const used=new Set((rows||[]).map(r=>dateParts(r.date)?.monthId).filter(Boolean));
  const out=[];let y=start.y,m=start.m;
  while(y<end.y||(y===end.y&&m<=end.m)){
    const id=`${y}-${String(m).padStart(2,'0')}`;
    if(!used.has(id))out.push(`${y-1911}/${m}`);
    m++;if(m>12){m=1;y++;}
  }
  return out;
}
function parseMonthId(id){const m=String(id||'').match(/^(\d{4})-(\d{1,2})$/);if(!m)return null;const year=+m[1], month=+m[2];return {year,month,y:year,m:month}}

}

function getSupabaseSettings(){try{return JSON.parse(localStorage.getItem(SUPA_STORE)||'{}')}catch(e){return {}}}
function saveSupabaseSettings(){const s=getSupabaseSettings();const url=document.getElementById('supabaseUrl')?.value.trim()||'';const key=document.getElementById('supabaseKey')?.value.trim()||'';localStorage.setItem(SUPA_STORE,JSON.stringify({...s,url,key,panelOpen:!document.getElementById('supabasePanel')?.classList.contains('hidden')}))}
function loadSupabaseSettings(){const s=getSupabaseSettings();const u=document.getElementById('supabaseUrl'),k=document.getElementById('supabaseKey'),p=document.getElementById('supabasePanel');if(u)u.value=s.url||'';if(k)k.value=s.key||'';if(p&&s.panelOpen)p.classList.remove('hidden');updateSupabaseStatus(supaConnected?'已連線':'未連線',supaConnected?'ok':'off',s.lastSyncAt||'')}
function autoConnectSupabase(){const s=getSupabaseSettings();if(!s.url||!s.key)return;let tries=0;const run=()=>{tries++;const u=document.getElementById('supabaseUrl'),k=document.getElementById('supabaseKey');if(u)u.value=s.url||'';if(k)k.value=s.key||'';if(window.supabase&&window.supabase.createClient){setSyncMsg('正在自動連線...');connectSupabase();}else if(tries<15){setTimeout(run,300);}else{updateSupabaseStatus('未連線','off');setSyncMsg('Supabase 函式庫尚未載入，請確認網路後按連線。')}};setTimeout(run,250)}
function setSyncMsg(msg){const el=document.getElementById('syncMsg');if(el)el.textContent=msg||''}
function updateSupabaseStatus(text,mode='off',last=''){const el=document.getElementById('syncStatus');if(el){el.textContent=text;el.className='sync-pill '+mode}const lastEl=document.getElementById('syncLast');if(lastEl){const s=getSupabaseSettings();lastEl.textContent='最後同步時間：'+(last||s.lastSyncAt||'—')}}
function toggleSupabasePanel(){const p=document.getElementById('supabasePanel');if(!p)return;p.classList.toggle('hidden');saveSupabaseSettings()}
function initSupabaseClient(){const url=document.getElementById('supabaseUrl')?.value.trim()||'';const key=document.getElementById('supabaseKey')?.value.trim()||'';if(!url||!key){alert('請先輸入 Supabase Project URL 和 Publishable Key');return null}if(!window.supabase||!window.supabase.createClient){alert('Supabase 函式庫尚未載入，請確認網路連線後再試一次。');return null}saveSupabaseSettings();supaClient=window.supabase.createClient(url,key);return supaClient}
async function connectSupabase(){const client=initSupabaseClient();if(!client)return;updateSupabaseStatus('連線中','warn');setSyncMsg('正在檢查雲端資料...');try{const {data,error}=await client.from(SUPA_TABLE).select('payload,updated_at').eq('workspace_key',SUPA_WORKSPACE).maybeSingle();if(error)throw error;supaConnected=true;if(supaPollTimer)clearInterval(supaPollTimer);supaPollTimer=setInterval(checkSupabaseRemote,9000);if(data&&data.payload){const remoteAt=data.updated_at||'';supaLastRemoteAt=remoteAt;const localAt=state?._meta?.localUpdatedAt||'';let remoteIsLatest=false;if(!localAt)remoteIsLatest=true;else if(remoteAt&&new Date(remoteAt)>=new Date(localAt))remoteIsLatest=true;if(remoteIsLatest){const remoteScore=dataScore(data.payload),localScore=dataScore(state);if(localScore>remoteScore+3){await uploadToSupabase(true);setSyncMsg('雲端資料較少，已保留本機資料並同步到雲端');}else{backupStateSnapshot('before-remote-apply');supaApplyingRemote=true;state=data.payload;if(!state._meta)state._meta={};state._meta.localUpdatedAt=remoteAt||new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(state));supaApplyingRemote=false;save({skipCloud:true});ensureMonth();render();markSupabaseSynced(remoteAt,'已自動載入雲端最新資料');}}else{await uploadToSupabase(true);setSyncMsg('本機資料較新，已自動同步到雲端');}}else{await uploadToSupabase(true);}updateSupabaseStatus('已連線','ok');}catch(err){console.error(err);supaConnected=false;updateSupabaseStatus('連線失敗','warn');setSyncMsg('請確認資料表/RLS/URL/Key：'+(err.message||err));}}
function markSupabaseSynced(remoteAt,msg){const now=new Date();const txt=now.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});const s=getSupabaseSettings();localStorage.setItem(SUPA_STORE,JSON.stringify({...s,lastSyncAt:txt}));supaLastRemoteAt=remoteAt||new Date().toISOString();updateSupabaseStatus(supaConnected?'已連線':'未連線',supaConnected?'ok':'off',txt);setSyncMsg(msg||'已同步')}
function disconnectSupabase(){supaConnected=false;supaClient=null;if(supaPollTimer)clearInterval(supaPollTimer);supaPollTimer=null;if(supaSaveTimer)clearTimeout(supaSaveTimer);supaSaveTimer=null;updateSupabaseStatus('未連線','off');setSyncMsg('已中斷')}
function scheduleSupabaseSave(){if(!supaConnected||!supaClient||supaApplyingRemote)return;if(supaSaveTimer)clearTimeout(supaSaveTimer);supaSaveTimer=setTimeout(()=>uploadToSupabase(false),1200)}
async function uploadToSupabase(manual=false){if(!supaConnected||!supaClient){if(manual)alert('尚未連線 Supabase');return}try{if(!state._meta)state._meta={};state._meta.localUpdatedAt=new Date().toISOString();const payload=JSON.parse(JSON.stringify(state));const {data,error}=await supaClient.from(SUPA_TABLE).upsert({workspace_key:SUPA_WORKSPACE,payload,updated_at:new Date().toISOString()},{onConflict:'workspace_key'}).select('updated_at').single();if(error)throw error;markSupabaseSynced(data?.updated_at,'已同步到雲端');}catch(err){console.error(err);updateSupabaseStatus('同步失敗','warn');setSyncMsg(err.message||String(err));}}
async function checkSupabaseRemote(){if(!supaConnected||!supaClient)return;try{const {data,error}=await supaClient.from(SUPA_TABLE).select('payload,updated_at').eq('workspace_key',SUPA_WORKSPACE).maybeSingle();if(error)throw error;if(!data||!data.payload)return;if(data.updated_at&&supaLastRemoteAt&&new Date(data.updated_at)<=new Date(supaLastRemoteAt))return;if(data.updated_at&&state?._meta?.localUpdatedAt&&new Date(data.updated_at)<=new Date(state._meta.localUpdatedAt))return;const remoteScore=dataScore(data.payload),localScore=dataScore(state);if(localScore>remoteScore+3){await uploadToSupabase(false);setSyncMsg('偵測到雲端資料較少，已保留本機資料。');return;}backupStateSnapshot('before-remote-poll-apply');supaApplyingRemote=true;state=data.payload;if(!state._meta)state._meta={};state._meta.localUpdatedAt=data.updated_at||new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(state));supaApplyingRemote=false;ensureMonth();render();markSupabaseSynced(data.updated_at,'已收到另一台電腦的最新更新。');}catch(err){console.error(err);updateSupabaseStatus('同步異常','warn');setSyncMsg(err.message||String(err));}}
async function manualSyncSupabase(){if(!supaConnected){const client=initSupabaseClient();if(!client)return;supaClient=client;supaConnected=true;}await uploadToSupabase(true)}

function printNum(v){

  const n=Number(String(v).replace(/[,，$＄\s]/g,''));
  return Number.isFinite(n)?n:0;

function printMoney(v,forceZero=false){
  if(v===null||v===undefined||String(v).trim()==='')return forceZero?'$0':'';
  const n=Number(String(v).replace(/[,，$＄\s]/g,''));
  if(!Number.isFinite(n))return forceZero?'$0':'';
  return (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
}
function printCardTotal(item){
  if(item&&Array.isArray(item.subItems)&&item.subItems.length){
    return item.subItems.reduce((s,d)=>s+printNum(d.amount),0);
  }
  return printNum(item&&item.amount);
}
function printCleanNote(note){
  let s=String(note||'').trim();

  // 列印時不要顯示「由○○項目紀錄帶入：」這段固定文字，
  // 但要保留後面的項目內容與說明。
  // 例：由「0982-508-091」項目紀錄帶入：115 年 2 月綜合帳單｜115/01/20-115/02/19
  // 會列印成：115 年 2 月綜合帳單｜115/01/20-115/02/19
  s=s.replace(/^由「[^」]+」項目紀錄帶入：\s*/,'');
  s=s.replace(/由「[^」]+」項目紀錄帶入：\s*/g,'');

  return s.trim();
}
function printSortKey(item){
  const d=String(item&&item.date||'').trim();
  const m=d.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(!m)return 99999999;
  let y=Number(m[1]); if(y<300)y+=1911;
  return y*10000+Number(m[2])*100+Number(m[3]);
}
function printGetSections(){
  const secs=((getMonth().personal||{}).sections||[]);
  const out={};
  secs.forEach(sec=>{
    const t=sec.title||'';
    if(t.includes('收入'))out['收入']=sec;
    else if(t.includes('大橋'))out['大橋']=sec;
    else if(t.includes('大社'))out['大社']=sec;
    else if(t.includes('信用卡'))out['信用卡']=sec;
  });
  return out;
}
function printItemKey(sectionTitle,item){
  return state.activeMonth+'||'+sectionTitle+'||'+String(item.id||item.label||'');
}
function printDisplayLabel(sectionTitle,item){
  const key=printItemKey(sectionTitle,item);
  return printLabelOverrides[key]!==undefined?printLabelOverrides[key]:String(item.label||'');
}
function printNoteWeight(text){
  const s=String(text||'').trim();
  if(!s)return 0;
  if(s.includes('\n'))return s.split('\n').length*18;
  let weight=0;
  for(const ch of s){weight += /[\u4e00-\u9fff\uff00-\uffef]/.test(ch)?1:.55;}
  return weight;
}
function printIsShortNote(text){
  const s=String(text||'').trim();
  if(!s)return true;
  if(s.includes('\n'))return s.split('\n').length<=1;
  return printNoteWeight(s)<=18;
}
function printIsLongNote(text){
  const s=String(text||'').trim();
  if(!s)return false;
  if(s.includes('\n'))return s.split('\n').length>=3;
  return printNoteWeight(s)>30;
}
function printEstimateNoteLines(text){
  const s=String(text||'').trim();
  if(!s)return 1;
  if(s.includes('\n'))return Math.min(4, Math.max(1, s.split('\n').length));
  const w=printNoteWeight(s);
  if(w<=18)return 1;
  if(w<=36)return 2;
  if(w<=54)return 3;
  return 4;
}
function printRowHeightByLines(lines){
  // V46：先以 3 行高度作為穩定基準，再由 tunePrintHeights 依一頁高度自動縮放。
  if(lines<=1)return 9.2;
  if(lines===2)return 10.4;
  if(lines===3)return 11.4;
  return 13.0;
}
function printBuildRows(sectionTitle,sec,isCard){
  const items=[...(((sec||{}).items)||[])].sort((a,b)=>printSortKey(a)-printSortKey(b));
  return items.map(it=>{
    const date=String(it.date||'').trim();
    const dateType=date?String(it.dateType||''):'';
    let note=printCleanNote(it.note);
    const amount=isCard?printMoney(printCardTotal(it),true):printMoney(it.amount,true);
    const label=printDisplayLabel(sectionTitle,it);

    // 列印：信用卡無帳單要在備註欄顯示「無帳單」
    if(isCard && it.noBill && !note) note='無帳單';

    // 列印：大社支出在備註欄顯示分攤/2 或 分攤/3；高雄翠屏路房貸不顯示
    if(sectionTitle==='大社' && !String(it.label||'').includes('高雄翠屏路房貸')){
      if(it.splitMode==='2' || it.splitMode==='3'){
        const splitText='分攤/'+it.splitMode;
        note = note ? (note+'｜'+splitText) : splitText;
      }
    }

    const lines=printEstimateNoteLines(note);
    const baseH=printRowHeightByLines(lines);
    const noteCls=lines>=3?' pv-long-note':(lines<=1?' pv-short-note':' pv-mid-note');
    return `<tr class="pv-row${noteCls}" data-lines="${lines}" style="--pv-this-row-h:${baseH}mm">
      <td class="pv-item">${esc(label)}</td>
      <td class="pv-amount">${esc(amount)}</td>
      <td class="pv-datetype">${esc(dateType)}</td>
      <td class="pv-date">${esc(date)}</td>
      <td class="pv-note">${esc(note)}</td>
    </tr>`;
  });
}
function printTableBox(title,cls,rows){
  const hasLong=rows.some(r=>r.includes('pv-long-note'));
  return `<section class="pv-box ${hasLong?'pv-has-long':''}">
    <div class="pv-header ${cls}">${esc(title)}</div>
    <div class="pv-body">
      <table>
        <colgroup>
          <col style="width:20%">
          <col style="width:11%">
          <col style="width:10%">
          <col style="width:11%">
          <col style="width:48%">
        </colgroup>
        <thead><tr><th>項目</th><th>金額</th><th>日期項目</th><th>日期</th><th>備註</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    </div>
  </section>`;
}

function buildPersonalPrintHtml(){
  const sections=printGetSections();
  const defs=[
    ['收入','pv-income',false],
    ['大橋','pv-bridge',false],
    ['大社','pv-home',false],
    ['信用卡','pv-card',true]
  ];
  const boxes=defs.map(([title,cls,isCard])=>printTableBox(title,cls,printBuildRows(title,sections[title],isCard))).join('');
  return `<div class="pv-page pv-personal-page">
    <div class="pv-page-no"></div>
    <h1>${esc(rocMonthLabel(state.activeMonth))} 帳款整理（麗卉）</h1>
    <div class="pv-sub">列印版</div>
    <div class="pv-grid">${boxes}</div>
  </div>`;
}
function printSimpleRowsHtml(rows){
  return (rows||[]).map(r=>{
    const date=r[0]||'';
    const income=r[1]!==''&&r[1]!==null&&r[1]!==undefined?printMoney(r[1],false):'';
    const expense=r[2]!==''&&r[2]!==null&&r[2]!==undefined?printMoney(r[2],false):'';
    const balance=r[3]!==''&&r[3]!==null&&r[3]!==undefined?printMoney(r[3],true):'';
    const note=r[4]||'';
    return `<tr><td class="pv-date">${esc(date)}</td><td class="pv-money">${esc(income)}</td><td class="pv-money out">${esc(expense)}</td><td class="pv-balance">${esc(balance)}</td><td class="pv-note">${esc(note)}</td></tr>`;
  }).join('');
}
function printChunkRows(rows,maxRows){
  const arr=Array.isArray(rows)?rows:[];
  if(!arr.length)return [[]];
  const chunks=[];
  for(let i=0;i<arr.length;i+=maxRows)chunks.push(arr.slice(i,i+maxRows));
  return chunks;
}
function buildSimpleAccountPage(title,rows,subtitle='',opts={}){
  const maxRows=opts.maxRows||72;
  const chunks=printChunkRows(rows,maxRows);
  return chunks.map((chunk,idx)=>{
    const body=printSimpleRowsHtml(chunk)||'<tr><td colspan="5" class="pv-note">目前沒有明細</td></tr>';
    const part=chunks.length>1?`（${idx+1}/${chunks.length}）`:'';
    return `<div class="pv-page pv-ledger-page">
      <div class="pv-page-no"></div>
      <h1>${esc(title)}${esc(part)}</h1>
      ${subtitle?`<div class="pv-simple-sub">${esc(subtitle)}</div>`:''}
      <section class="pv-simple-section">
        <table class="pv-simple-table">
          <colgroup><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:44%"></colgroup>
          <thead><tr><th>日期</th><th>收入</th><th>支出</th><th>餘額</th><th>備註</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </section>
    </div>`;
  }).join('');
}
function buildLedgerPrintHtml(kind,title){
  const rows=ledgerExcelRows(kind).slice(1);
  return buildSimpleAccountPage(title,rows,'',{maxRows:60});
}
function buildPettyPrintHtml(){
  const dajie=pettyExcelRows('dajie').slice(1);
  const erjie=pettyExcelRows('erjie').slice(1);
  return buildSimpleAccountPage('大姊零用金',dajie,'',{maxRows:60}) + buildSimpleAccountPage('二姊零用金',erjie,'',{maxRows:60});
}
function applyPrintPageNumbers(){
  const pv=document.getElementById('printView');
  if(!pv)return;
  const pages=[...pv.querySelectorAll('.pv-page')];
  const total=pages.length;
  pages.forEach((page,i)=>{
    let no=page.querySelector('.pv-page-no');
    if(!no){no=document.createElement('div');no.className='pv-page-no';page.prepend(no);}
    no.textContent=`P.${i+1}/${total}`;
  });
}
function scalePersonalPrintPage(){
  const pv=document.getElementById('printView');
  const page=pv&&pv.querySelector('.pv-personal-page');
  if(!pv||!page)return;
  pv.classList.remove('pv-scale-down');
  page.style.setProperty('--pv-scale','1');
  const pxPerMm=96/25.4;
  const maxPx=280*pxPerMm;
  const h=page.scrollHeight;
  if(h>maxPx){
    const scale=Math.max(.84, Math.min(1, (maxPx/h)*0.985));
    page.style.setProperty('--pv-scale', scale.toFixed(3));
    pv.classList.add('pv-scale-down');
  }
}
function showPrintChoice(){
  const m=document.getElementById('printChoiceModal');
  if(m)m.classList.remove('hidden');
}
function closePrintChoice(){
  const m=document.getElementById('printChoiceModal');
  if(m)m.classList.add('hidden');
}
function buildPrintHtmlByMode(mode){
  if(mode==='personal')return buildPersonalPrintHtml();
  if(mode==='post')return buildLedgerPrintHtml('postOffice','郵局帳款');
  if(mode==='bank')return buildLedgerPrintHtml('taiwanBank','台灣銀行帳款');
  if(mode==='petty')return buildPettyPrintHtml();
  if(mode==='all')return buildPersonalPrintHtml()+buildLedgerPrintHtml('postOffice','郵局帳款')+buildLedgerPrintHtml('taiwanBank','台灣銀行帳款')+buildPettyPrintHtml();
  return buildPersonalPrintHtml();
}
function openPrintMode(mode){
  closePrintChoice();
  const pv=document.getElementById('printView');
  if(!pv)return;
  pv.classList.remove('pv-scale-down');
  pv.innerHTML=buildPrintHtmlByMode(mode);
  applyPrintPageNumbers();

  // V90：對照 V86，個人帳款要先完成列高壓縮與縮放，再呼叫列印，避免跳到第 2 頁。
  if(mode==='personal' || mode==='all'){
    tunePrintHeights();
    scalePersonalPrintPage();
    applyPrintPageNumbers();
  }
  requestAnimationFrame(()=>{
    if(mode==='personal' || mode==='all'){
      tunePrintHeights();
      scalePersonalPrintPage();
    }
    applyPrintPageNumbers();
    window.print();
  });
}
function renderPrint(){
  const pv=document.getElementById('printView');
  if(!pv)return;
  pv.classList.remove('pv-scale-down');
  pv.innerHTML=buildPersonalPrintHtml();
  applyPrintPageNumbers();
  tunePrintHeights();
  scalePersonalPrintPage();
  applyPrintPageNumbers();
}
function tunePrintHeights(){
  const pv=document.getElementById('printView');
  const page=pv&&pv.querySelector('.pv-page');
  if(!pv||!page)return;

  const boxes=[...page.querySelectorAll('.pv-box')];
  const rows=[...page.querySelectorAll('tr.pv-row')];
  if(rows.length===0)return;

  /*
    V46：三行高度基準 + 一頁內自動平衡。
    先讓每列接近 3 行高度，看起來穩定；
    如果該月份列數多，會整體等比例縮短列高，保證不超過第 2 頁。
  */
  const pageH=280;       // V47：更保守，避免 P.2 只剩表頭
  const pagePad=1.6;
  const titleH=7.2;
  const gapH=Math.max(0, boxes.length-1)*0.45;
  const boxHeaderH=boxes.length*4.95;
  const tableHeaderH=boxes.length*4.0;
  const borderSafe=boxes.length*1.35;
  const available=pageH-pagePad-titleH-gapH-boxHeaderH-tableHeaderH-borderSafe;

  const rowInfos=rows.map(row=>{
    const lines=Number(row.dataset.lines||1);
    const base=printRowHeightByLines(lines);
    const minH=lines<=1 ? 4.3 : (lines===2 ? 5.8 : 7.0);
    return {row, lines, base, h:base, minH};
  });

  const baseTotal=rowInfos.reduce((s,r)=>s+r.base,0);
  let factor=baseTotal>0 ? Math.min(1, available/baseTotal) : 1;

  // 若資料少，保留三行基準，不硬撐到過高。
  // 若資料多，比例縮短，避免 P.2。
  rowInfos.forEach(r=>{
    r.h=Math.max(r.minH, r.base*factor);
    r.row.style.setProperty('--pv-this-row-h', r.h.toFixed(2)+'mm');
  });

  const pxPerMm=96/25.4;
  const maxPx=280*pxPerMm;
  for(let i=0;i<4;i++){
    if(page.scrollHeight<=maxPx)break;
    const f=Math.max(0.78, maxPx/page.scrollHeight);
    rowInfos.forEach(r=>{
      r.h=Math.max(r.minH, r.h*f);
      r.row.style.setProperty('--pv-this-row-h', r.h.toFixed(2)+'mm');
    });
  }
}
function openPrint(){
  openPrintMode('personal');
}
function renderPrintBreakPanel(){
  const list=document.getElementById('printBreakList');
  if(!list)return;
  const sections=printGetSections();
  const defs=[['收入',false],['大橋',false],['大社',false],['信用卡',true]];
  let html='';
  defs.forEach(([title])=>{
    const items=[...((((sections[title]||{}).items)||[]))].sort((a,b)=>printSortKey(a)-printSortKey(b));
    items.forEach(it=>{
      const key=printItemKey(title,it);
      const val=printLabelOverrides[key]!==undefined?printLabelOverrides[key]:String(it.label||'');
      html+=`<div class="print-break-item">
        <div class="print-break-sec">${esc(title)}</div>
        <textarea data-key="${esc(key)}" oninput="setPrintLabelOverride(this.dataset.key,this.value)">${esc(val)}</textarea>
      </div>`;
    });
  });
  list.innerHTML=html||'<div class="hint">目前沒有可設定的列印項目。</div>';
}
function setPrintLabelOverride(key,value){
  printLabelOverrides[key]=value;
  localStorage.setItem(PRINT_LABEL_STORE,JSON.stringify(printLabelOverrides));
  renderPrint();
}
function resetPrintLabelOverrides(){
  if(!confirm('清除目前儲存的列印項目換行設定？'))return;
  printLabelOverrides={};
  localStorage.removeItem(PRINT_LABEL_STORE);
  renderPrintBreakPanel();
  renderPrint();
}
function togglePrintBreakPanel(){
  const panel=document.getElementById('printBreakPanel');
  if(!panel)return;
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden'))renderPrintBreakPanel();
}

function exportFileStamp(){
  const d=new Date();
  const roc=d.getFullYear()-1911;
  const pad=n=>String(n).padStart(2,'0');
  return `${roc}年${d.getMonth()+1}月${d.getDate()}日_${pad(d.getHours())}點${pad(d.getMinutes())}分`;
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`麗卉帳款_${exportFileStamp()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

window.addEventListener('load',()=>{load();render();loadSupabaseSettings();autoConnectSupabase()});
