          <button class="act-btn act-fixedsetting" onclick="toggleFixedAmountPanel()">固定金額設定</button>

function dataScore(obj){
  try{
    if(!obj||typeof obj!=='object')return 0;
    let score=0;
    const months=obj.months||{};
    score+=Object.keys(months).length*4;
    const countVal=v=>{if(v===null||v===undefined)return 0;return String(v).trim()?1:0};
    Object.values(months).forEach(m=>{
      ((m.personal||{}).sections||[]).forEach(sec=>{
        (sec.items||[]).forEach(it=>{
          score+=countVal(it.amount)+countVal(it.date)+countVal(it.note);
          if(it.isCard)score+=(it.subItems||[]).length*3;
        });
      });
      score+=((m.postOffice||{}).txs||[]).length*3;
      score+=((m.taiwanBank||{}).txs||[]).length*3;
      const p=((m.taiwanBank||{}).petty||{});
      score+=countVal(p.dajieStart)+countVal(p.erjieStart)+((p.dajieTxs||[]).length+(p.erjieTxs||[]).length)*3;
      const nums=((m.mobile||{}).numbers||{});
      Object.values(nums).forEach(n=>score+=((n||{}).records||[]).length*2);
    });
    const g=obj.globalData||{};
    score+=(((g.postOffice||{}).txs||[]).length+((g.taiwanBank||{}).txs||[]).length)*3;
    const gp=((g.taiwanBank||{}).petty||{});
    score+=countVal(gp.dajieStart)+countVal(gp.erjieStart)+((gp.dajieTxs||[]).length+(gp.erjieTxs||[]).length)*3;
    Object.values(((g.mobile||{}).numbers)||{}).forEach(n=>score+=((n||{}).records||[]).length*2);
    const cb=obj._cardPasteBackup||obj.cardPasteBackup||obj.cardPaste||obj._cardPaste||{};
    if(Array.isArray(cb.records))score+=cb.records.length*3;
    if(Array.isArray(cb.legacyRecords))score+=cb.legacyRecords.length*2;
    if(cb.claims&&typeof cb.claims==='object')score+=Object.keys(cb.claims).length*2;
    return score;
  }catch(e){return 0}
}

function findBestLocalAccountState(){

  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key||key===SUPA_STORE||key===PRINT_LABEL_STORE)continue;
      const raw=localStorage.getItem(key);
      if(!raw||raw.length<50)continue;

      if(isAccountState(obj))candidates.push({key,score:dataScore(obj),time:newestTimeValue(obj),payload:obj});

}

function normalizeMonth(input){let s=String(input||'').trim();let m=s.match(/^(\d{2,4})[-\/年]?(\d{1,2})/);if(!m)return null;let y=+m[1],mo=+m[2];if(mo<1||mo>12)return null;if(y<300)y+=1911;return `${y}-${String(mo).padStart(2,'0')}`}

function parseRocDateInput(input){
  let raw=String(input||'').trim();
  if(!raw)return {value:'',empty:true};
  let s=raw.replace(/[年月.\-]/g,'/').replace(/日/g,'').replace(/\/+/g,'/').replace(/^\//,'').replace(/\/$/,'');
  let y,mo,d,m;
  m=s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{
    m=s.match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m)return {value:'',error:true,raw};
    y=(new Date()).getFullYear()-1911;mo=+m[1];d=+m[2];
  }
  if(y>1911)y-=1911;
  const ad=y+1911;
  const dt=new Date(ad,mo-1,d);
  const ok=Number.isInteger(y)&&Number.isInteger(mo)&&Number.isInteger(d)&&y>0&&mo>=1&&mo<=12&&d>=1&&dt.getFullYear()===ad&&dt.getMonth()===(mo-1)&&dt.getDate()===d;
  if(!ok)return {value:'',error:true,raw};
  return {value:`${y}/${mo}/${d}`,empty:false};

function dateValue(s){s=normalizeDate(s,{silent:true});const m=String(s).match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return 0;let y=+m[1];if(y<300)y+=1911;return y*10000+(+m[2])*100+(+m[3])}
function sortDateNearToFarEntries(list){
  // 日期近到遠：較新的日期排前面；快速按鈕剛新增的資料固定在第一列方便輸入。
  return (list||[]).map((item,index)=>({item,index}))
    .sort((a,b)=>{
      if(a.item._newTop&&!b.item._newTop)return -1;
      if(b.item._newTop&&!a.item._newTop)return 1;
      const av=dateValue(a.item.date), bv=dateValue(b.item.date);
      if(av!==bv)return bv-av;
      return a.index-b.index;
    });
}

    // 期初餘額沒有日期，固定放最下面，避免卡在最上面。

    if(b.type==='start'&&a.type!=='start')return -1;

}

function upsertMonthlyItemRule(row,patch={}){
  const rules=ensureMonthlyItemRules();
  const key=monthlyItemKey(row.section,row.label);
  let r=rules.find(x=>monthlyItemKey(x.section,x.label)===key);
  if(!r){r={section:row.section,label:row.label,dateType:row.dateType||monthlyItemDateTypeDefault(row.section),freq:row.freq||inferMonthlyItemFrequency(row),startMonth:patch.startMonth||'',type:row.type||monthlyItemTypeForSection(row.section),isCard:!!row.isCard};rules.push(r);}
  Object.assign(r,patch);
  r.section=patch.section||r.section||row.section;
  r.label=patch.label||r.label||row.label;
  r.dateType=patch.dateType||r.dateType||row.dateType||monthlyItemDateTypeDefault(r.section);
  r.freq=patch.freq||r.freq||row.freq||'monthly';
  r.type=patch.type||r.type||row.type||monthlyItemTypeForSection(r.section);
  r.isCard=patch.isCard!==undefined?patch.isCard:(r.isCard||!!row.isCard||monthlyItemIsCardSection(r.section));

function inferMonthlyItemFrequency(row){
  const arr=Array.from(row.months||[]).filter(Boolean);
  if(!arr.length)return 'monthly';
  const nums=arr.map(id=>Number(String(id).split('-')[1]||0)).filter(Boolean);
  if(nums.length&&nums.every(m=>m%2===1))return 'odd';
  if(nums.length&&nums.every(m=>m%2===0))return 'even';
  return 'monthly';
}
function monthIdMatchesFrequency(mid,freq,startMonth=''){
  if(startMonth&&String(mid)<String(startMonth))return false;

function collectMonthlyItemRows(){
  const map=new Map();
  Object.entries(state.months||{}).forEach(([mid,m])=>{
    (((m||{}).personal||{}).sections||[]).forEach(sec=>{
      (sec.items||[]).forEach(it=>{
        const label=String(it.label||'').trim();
        if(!label)return;
        const section=String(sec.title||'').trim()||'其他';
        const key=monthlyItemKey(section,label);
        if(!map.has(key))map.set(key,{section,label,dateType:it.dateType||'',type:it.type||monthlyItemTypeForSection(section),isCard:!!it.isCard,count:0,months:new Set()});
        const row=map.get(key);
        row.count++;
        row.months.add(mid);
        if(!row.dateType&&it.dateType)row.dateType=it.dateType;
        row.isCard=row.isCard||!!it.isCard||monthlyItemIsCardSection(section);
      });
    });
  });
  const rows=Array.from(map.values()).map(row=>{
    const rule=findMonthlyItemRule(row.section,row.label);
    const freq=rule?.freq||inferMonthlyItemFrequency(row);
    if(!rule)upsertMonthlyItemRule(row,{freq,dateType:row.dateType||monthlyItemDateTypeDefault(row.section)});
    return {...row,freq,dateType:(rule?.dateType||row.dateType||monthlyItemDateTypeDefault(row.section)),type:(rule?.type||row.type),isCard:(rule?.isCard||row.isCard)};
  });
  return rows.sort((a,b)=>{
    const so=monthlyItemSectionOptions();
    const ai=so.indexOf(a.section),bi=so.indexOf(b.section);
    if(ai!==bi)return (ai<0?999:ai)-(bi<0?999:bi);
    return a.label.localeCompare(b.label,'zh-Hant');
  });
}

  (((copied.personal||{}).sections)||[]).forEach(sec=>{

}

function monthsMentionedInDadLivingBankTx(t){
  // 臺灣銀行「麗雅給爸生活費」：用交易日期決定年份，用備註拆月份。
  // 例：日期115/5/1、備註「1-2月」＝115/1、115/2；若備註空白則用交易日期月份。
  const txMonth=txMonthIdFromDate(t);
  const txp=parseMonthId(txMonth);
  const text=[t&&t.note,t&&t.item].filter(Boolean).join('｜');
  const out=new Set();
  let m;
  const yearRangeRe=/(\d{2,3})\s*年?\s*(\d{1,2})\s*[-~～至到]\s*(\d{1,2})\s*月/g;
  while((m=yearRangeRe.exec(text))){
    let y=+m[1];if(y<300)y+=1911;let a=+m[2],b=+m[3];if(a>b){const tmp=a;a=b;b=tmp;}
    for(let mm=a;mm<=b;mm++)if(mm>=1&&mm<=12)out.add(`${y}-${String(mm).padStart(2,'0')}`);
  }
  const rangeRe=/(\d{1,2})\s*[-~～至到]\s*(\d{1,2})\s*月/g;
  while((m=rangeRe.exec(text))){
    if(!txp)continue;let a=+m[1],b=+m[2];if(a>b){const tmp=a;a=b;b=tmp;}
    for(let mm=a;mm<=b;mm++)if(mm>=1&&mm<=12)out.add(`${txp.year}-${String(mm).padStart(2,'0')}`);
  }
  const multiMonthRe=/((?:\d{1,2}\s*[、,，.．]\s*)+\d{1,2})\s*月/g;
  while((m=multiMonthRe.exec(text))){
    if(!txp)continue;String(m[1]).split(/[、,，.．]/).forEach(x=>{const mm=+String(x).trim();if(mm>=1&&mm<=12)out.add(`${txp.year}-${String(mm).padStart(2,'0')}`);});
  }
  // 民國年只接受獨立的 2～3 位數，避免把西元 2026/07/15 從中間誤讀成 026/07/15。
  const rocDateRe=/(?<![\d/])(\d{2,3})\/(\d{1,2})(?:\/(\d{1,2}))?/g;
  while((m=rocDateRe.exec(text))){const id=monthIdFromRoc(m[1],m[2]);if(id)out.add(id);}
  const rocYearMonthRe=/(\d{2,3})\s*年\s*(\d{1,2})\s*月/g;
  while((m=rocYearMonthRe.exec(text))){const id=monthIdFromRoc(m[1],m[2]);if(id)out.add(id);}
  const oneRe=/(?:^|[^\d])(\d{1,2})\s*月/g;
  while((m=oneRe.exec(text))){if(txp){const mm=+m[1];if(mm>=1&&mm<=12)out.add(`${txp.year}-${String(mm).padStart(2,'0')}`);}}
  if(!out.size&&txMonth)out.add(txMonth);
  return Array.from(out);
}

function cardPastePct(v){const n=Number(String(v==null?'':v).replace(/[％%]/g,'').replace(/，/g,'.'));return isFinite(n)?Math.max(0,Math.min(100,n)):0}
function cardPasteShareAmountForHome(r,owner){
  if(!r)return 0;
  const amount=num(r.amount);
  if(cardPasteRowHasShare(r))return Math.round(amount*(owner==='志偉負擔'?cardPastePct(r.zhiweiPct):cardPastePct(r.lihuiPct))/100);
  return String((r&&r.payer)||'').trim()===owner?amount:0;
}
function cardPasteRecordNeedsClaimForHome(r,owner){
  if(owner!=='志偉負擔')return false;
  if(cardPasteShareAmountForHome(r,owner)<=0)return false;
  return String((r&&r.claimMode)||'yes')!=='no';
}
function cardPasteOwnerTotalForHome(records,monthId,owner){return records.filter(r=>getCardPasteMonthFromRecord(r)===monthId&&cardPasteRecordNeedsClaimForHome(r,owner)).reduce((s,r)=>s+cardPasteShareAmountForHome(r,owner),0)}
function cardPasteClaimDoneForHome(claims,monthId,owner){const roc=monthIdToRocShort(monthId);const c=claims&&claims[roc]&&claims[roc][owner];return !!(c&&String(c.date||'').trim())}
function cardPasteClaimMonthAllowedForHome(monthId){
  const cur=currentReminderMonthId();
  const p=parseMonthId(monthId), cp=parseMonthId(cur);
  if(!p||!cp)return !!monthId;
  // V184：請款提醒不能只看本月/上月；所有已存入刷卡總欄、且不屬於未來月份的未請款月份都要提醒。
  return String(monthId)<=String(cur);
}
function buildCardPasteHomeRows(){
  const records=getCardPasteRecordsForHome();
  const claims=getCardPasteClaimsForHome();
  const checkMonths=[...new Set(records.map(r=>getCardPasteMonthFromRecord(r)).filter(id=>id&&cardPasteClaimMonthAllowedForHome(id)))].sort();
  const rows=[];
  [['志偉負擔','跟志偉請款']].forEach(([owner,label])=>{
    const miss=checkMonths.filter(id=>{
      const hasTotal=cardPasteOwnerTotalForHome(records,id,owner)>0;
      return hasTotal&&!cardPasteClaimDoneForHome(claims,id,owner);
    });
    if(miss.length)rows.push({name:label,type:'請款',missing:miss,ruleText:'有「志偉負擔」刷卡紀錄但尚未填請款日期'});
  });
  return rows;
}
function buildHomeReminderData(){
  const personalMonths=reminderMonthsByDueDay(15);
  const personalMissing=personalMonths.filter(id=>!personalMonthHasInput(id));
  const personalItemRows=buildPersonalItemHomeRows(personalMonths);
  const mobileRows=HOME_MOBILE_RULES.map(r=>{const months=reminderMonthsByDueDay(r.due);return {...r,months,missing:months.filter(id=>!mobileRecordMonthExists(r.key,id))};});
  const dadData=getDadLivingData();
  const dadItemMissing=getDadLivingMissingMonths(dadData.rows||[],dadData.startMonth||DAD_LIVING_REMINDER_START_MONTH);
  mobileRows.push({name:'爸生活費',due:null,key:DAD_LIVING_TAB,months:dadItemMissing,missing:dadItemMissing,ruleText:'項目紀錄尚未紀錄'});
  const bankRows=HOME_BANK_RULES.map(r=>{
    if(r.name==='給爸生活費'){
      const missing=getDadLivingBankMissingMonths();
      return {...r,months:missing,missing,ruleText:'臺灣銀行尚未支出「麗雅給爸生活費」'};
    }
    const months=r.due?reminderMonthsByDueDay(r.due):reminderMonthsNoDue();
    return {...r,months,missing:months.filter(id=>!hasLedgerMonth('taiwanBank',id,r.type,r.keys))};
  });
  const mgMissing=getLaiyaManagementMissingMonths();
  bankRows.push({name:'麗雅大社管理費',type:'expense',due:null,keys:['麗雅大社半年管理費'],months:mgMissing,missing:mgMissing,ruleText:'臺灣銀行尚未匯款給麗卉帳戶'});
  const postRows=HOME_POST_RULES.map(r=>{const months=reminderMonthsNoDue();return {...r,months,missing:months.filter(id=>!hasLedgerMonth('postOffice',id,r.type,r.keys))};});
  const cardRows=buildCardPasteHomeRows();
  return {personalMissing,personalItemRows,mobileRows,bankRows,postRows,cardRows};
}
function calcHomeReminderTotal(){try{const d=buildHomeReminderData();const personalCount=(d.personalItemRows&&d.personalItemRows.length)?d.personalItemRows.reduce((s,r)=>s+r.missing.length,0):d.personalMissing.length;return personalCount+d.mobileRows.reduce((s,r)=>s+r.missing.length,0)+d.bankRows.reduce((s,r)=>s+r.missing.length,0)+d.postRows.reduce((s,r)=>s+r.missing.length,0)+(d.cardRows||[]).reduce((s,r)=>s+r.missing.length,0);}catch(e){return 0}}
function homeStatusHtml(missing){return (missing&&missing.length)?`<span class="home-reminder-status missing">缺 ${esc(reminderMonthText(missing))}</span>`:`<span class="home-reminder-status ok">已完成</span>`;}
function dueText(due){return due?`每月${due}日前`:'每月要有輸入'}
function homeReminderRow(name,rule,status,goHtml){return `<div class="home-check-row"><div class="home-check-name">${esc(name)}</div><div class="home-check-rule">${esc(rule)}</div><div>${status}</div><div>${goHtml||''}</div></div>`}
function renderHomeSection(title,rows,missCount){return `<div class="home-section-card"><div class="home-section-title"><b>${esc(title)}</b><span class="home-pill ${missCount?'warn':'ok'}">${missCount?`缺 ${missCount}`:'OK'}</span></div>${rows}</div>`;}
function todayRocText(){const d=new Date();return `${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()} 星期${'日一二三四五六'[d.getDay()]}`;}
function homeStatCard(cls,title,count,sub){return `<div class="home-stat-card ${cls||''}"><div class="home-stat-name">${esc(title)}</div><div class="home-stat-line"><div class="home-stat-count ${count?'':'ok'}">${count||'OK'}</div><div class="home-stat-text">${esc(sub)}</div></div></div>`;}
function homeMissingCard(group,name,months,rule,action){return `<div class="home-missing-card"><div class="home-missing-top"><span class="home-missing-group">${esc(group)}</span><button class="home-go warn" onclick='${action}'>前往</button></div><div class="home-missing-title">${esc(name)}</div><div class="home-missing-month">缺：${esc(reminderMonthText(months))}</div><div class="home-missing-rule">${esc(rule)}</div></div>`;}
function homeMonthListText(months){
  return (months||[]).map(v=>/^\d{4}-\d{1,2}$/.test(String(v))?monthIdToRocShort(v):String(v)).join('、');
}

    {t:'郵局帳款',items:['每月跟志偉索取截圖','輸入郵局帳款']},

function ensureHomeBulletinCards(){
  if(!state) return defaultHomeBulletinCards();
  if(!Array.isArray(state.homeBulletinCards)||!state.homeBulletinCards.length){
    state.homeBulletinCards=defaultHomeBulletinCards();
  }
  state.homeBulletinCards=state.homeBulletinCards.map(c=>({
    t:String((c&&c.t)||'').trim()||'未命名項目',
    items:Array.isArray(c&&c.items)?c.items.map(x=>String(x||'').trim()).filter(Boolean):[]
  }));
  return state.homeBulletinCards;
}

  const addBox=`<div class="bulletin-add-card">
    <div><div class="tiny">新增大項目</div><input id="bulletinNewTitle" placeholder="例如：每月帳款"></div>
    <button type="button" onclick="addHomeBulletinCard()">＋新增</button>

  const list=cards.length?`<div class="bulletin-card-list">${cards.map((c,i)=>`<div class="bulletin-card-edit">

function addHomeBulletinCard(){
  const title=String(document.getElementById('bulletinNewTitle')?.value||'').trim();
  if(!title)return alert('請輸入大項目名稱');
  ensureHomeBulletinCards().push({t:title,items:[]});
  save();renderHomeBulletinManagerPanel();if(state.activeTab==='home')renderHome();
}
function renameHomeBulletinCard(i,val){
  const cards=ensureHomeBulletinCards();
  if(!cards[i])return;
  const title=String(val||'').trim();
  if(!title){renderHomeBulletinManagerPanel();return alert('大項目名稱不能空白');}
  cards[i].t=title;
  save();if(state.activeTab==='home')renderHome();
}
function deleteHomeBulletinCard(i){
  const cards=ensureHomeBulletinCards();
  if(!cards[i])return;
  if(!confirm('確定刪除「'+cards[i].t+'」？'))return;
  cards.splice(i,1);
  save();renderHomeBulletinManagerPanel();if(state.activeTab==='home')renderHome();
}
function addHomeBulletinItem(i){
  const cards=ensureHomeBulletinCards();
  if(!cards[i])return;
  if(!Array.isArray(cards[i].items))cards[i].items=[];
  cards[i].items.push('新增內容');
  const newIndex=cards[i].items.length-1;
  save();
  renderHomeBulletinManagerPanel();
  setTimeout(()=>{
    const inp=document.querySelector(`[data-bulletin-input="${i}-${newIndex}"]`);
    if(inp){inp.focus();inp.select();}
  },0);
  if(state.activeTab==='home')renderHome();
}
function updateHomeBulletinItem(i,j,val){
  const cards=ensureHomeBulletinCards();
  if(!cards[i]||!Array.isArray(cards[i].items))return;
  const text=String(val||'').trim();
  if(!text){cards[i].items.splice(j,1);}else{cards[i].items[j]=text;}
  save();renderHomeBulletinManagerPanel();if(state.activeTab==='home')renderHome();
}
function deleteHomeBulletinItem(i,j){
  const cards=ensureHomeBulletinCards();
  if(!cards[i]||!Array.isArray(cards[i].items))return;
  cards[i].items.splice(j,1);
  save();renderHomeBulletinManagerPanel();if(state.activeTab==='home')renderHome();
}
function resetHomeBulletinCards(){
  if(!confirm('恢復公佈欄預設內容？目前自訂內容會被覆蓋。'))return;
  state.homeBulletinCards=defaultHomeBulletinCards();
  save();renderHomeBulletinManagerPanel();if(state.activeTab==='home')renderHome();
}
function toggleHomeBulletinManagerPanel(){
  const p=document.getElementById('homeBulletinManagerPanel');
  if(!p)return;
  p.classList.toggle('hidden');
  if(!p.classList.contains('hidden'))renderHomeBulletinManagerPanel();
}

function summaryMonthIds(){
  const ids=Object.keys(state.months||{});
  if(!ids.includes(state.activeMonth))ids.push(state.activeMonth);
  // 總欄表月份：最近月份在左，越舊越右。
  return [...new Set(ids)].sort().reverse();
}
function summaryBlankCell(){return {amount:'',date:''}}
function summaryFmtAmount(v,opts={}){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='string'&&v&&!/^[-,\d]+$/.test(v))return v;
  const n=Number(String(v).replace(/,/g,''));
  if(!Number.isFinite(n)||n===0)return '';
  return opts.signed?fmtSigned(n,true):fmt(n,true);
}
function summaryUniqueDates(list){
  return [...new Set((list||[]).map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>dateValue(a)-dateValue(b)).join('、');
}
function summaryFindPersonalItem(monthId,sectionTitle,matcher){
  const m=state.months?.[monthId];
  const sections=m?.personal?.sections||[];
  const sec=sections.find(s=>String(s.title||'')===sectionTitle);
  const items=sec?.items||[];
  return items.find(it=>matcher(String(it.label||''),it))||null;
}
function summaryPersonalCell(monthId,sectionTitle,matcher){
  const it=summaryFindPersonalItem(monthId,sectionTitle,matcher);
  if(!it)return summaryBlankCell();
  if(it.isCard){
    if(it.noBill)return {amount:'無帳單',date:it.date||''};
    const sum=(it.subItems||[]).reduce((s,d)=>s+numSigned(d.amount),0);
    return {amount:summaryFmtAmount(sum,{signed:true}),date:it.date||''};
  }
  return {amount:summaryFmtAmount(num(it.amount)),date:it.date||''};
}
function summaryLedgerCell(kind,monthId,matcher,type){
  const txs=(getGlobalData()?.[kind]?.txs||[]).filter(t=>{
    const p=dateParts(t.date);
    if(!p||p.monthId!==monthId)return false;
    if(type&&t.type!==type)return false;
    return matcher(t);
  });
  if(!txs.length)return summaryBlankCell();
  const total=txs.reduce((s,t)=>s+num(t.amount),0);
  return {amount:summaryFmtAmount(total),date:summaryUniqueDates(txs.map(t=>t.date))};
}
function summaryItemText(t){return String([t.item,t.note].filter(Boolean).join(' ')).toLowerCase();}
function summaryDadLivingDateLabelsForMonth(t,monthId){
  const text=String([t&&t.note,t&&t.item].filter(Boolean).join('｜'));
  const txMonth=txMonthIdFromDate(t);
  const txp=parseMonthId(txMonth);
  const out=new Set();
  const pushMonthLabel=()=>out.add(rocMonthLabel(monthId));
  let m;
  const fullDateRe=/(\d{2,3})\s*[\/年.．-]\s*(\d{1,2})(?:\s*[\/月.．-]\s*(\d{1,2}))?\s*日?/g;
  while((m=fullDateRe.exec(text))){
    const id=monthIdFromRoc(m[1],m[2]);
    if(id===monthId){
      const yy=(+m[1]>1911?+m[1]-1911:+m[1]);
      out.add(m[3]?`${yy}/${+m[2]}/${+m[3]}`:`${yy}/${+m[2]}`);
    }
  }
  const yearRangeRe=/(\d{2,3})\s*年?\s*(\d{1,2})\s*[-~～至到]\s*(\d{1,2})\s*月/g;
  while((m=yearRangeRe.exec(text))){
    let y=+m[1];if(y<300)y+=1911;let a=+m[2],b=+m[3];if(a>b){const tmp=a;a=b;b=tmp;}
    const p=parseMonthId(monthId);
    if(p&&p.year===y&&p.month>=a&&p.month<=b)pushMonthLabel();
  }
  const rangeRe=/(\d{1,2})\s*[-~～至到]\s*(\d{1,2})\s*月/g;
  while((m=rangeRe.exec(text))){
    if(!txp)continue;let a=+m[1],b=+m[2];if(a>b){const tmp=a;a=b;b=tmp;}
    const p=parseMonthId(monthId);
    if(p&&p.year===txp.year&&p.month>=a&&p.month<=b)pushMonthLabel();
  }
  const multiMonthRe=/((?:\d{1,2}\s*[、,，.．]\s*)+\d{1,2})\s*月/g;
  while((m=multiMonthRe.exec(text))){
    if(!txp)continue;const p=parseMonthId(monthId);if(!p||p.year!==txp.year)continue;
    String(m[1]).split(/[、,，.．]/).forEach(x=>{const mm=+String(x).trim();if(mm===p.month)pushMonthLabel();});
  }
  const simpleSlashRe=/(?:^|[^\d])(\d{1,2})\/(\d{1,2})(?:[^\d]|$)/g;
  while((m=simpleSlashRe.exec(text))){
    if(!txp)continue;const mo=+m[1],day=+m[2];const p=parseMonthId(monthId);
    if(p&&p.year===txp.year&&p.month===mo&&day>=1&&day<=31)out.add(`${txp.year-1911}/${mo}/${day}`);
  }
  const oneRe=/(?:^|[^\d])(\d{1,2})\s*月/g;
  while((m=oneRe.exec(text))){
    if(!txp)continue;const mm=+m[1];const p=parseMonthId(monthId);
    if(p&&p.year===txp.year&&p.month===mm)pushMonthLabel();
  }
  return Array.from(out);
}
function summaryDadLivingBankCell(monthId){
  const txs=(getGlobalData()?.taiwanBank?.txs||[]).filter(t=>{
    if(!t||t.type!=='expense'||!num(t.amount))return false;
    const text=txText(t);
    if(!text.includes(DAD_LIVING_BANK_ITEM_KEY))return false;
    return monthsMentionedInDadLivingBankTx(t).includes(monthId);
  });
  if(!txs.length)return summaryBlankCell();
  const total=txs.reduce((s,t)=>s+num(t.amount),0);
  const labels=[];
  txs.forEach(t=>{
    const noteLabels=summaryDadLivingDateLabelsForMonth(t,monthId);
    if(noteLabels.length)labels.push(...noteLabels);
    else if(t.date)labels.push(t.date);
  });
  const dates=labels.length?Array.from(new Set(labels)).join('、'):summaryUniqueDates(txs.map(t=>t.date));
  return {amount:summaryFmtAmount(total),date:dates};
}

function ensureAssetOverview(){
  if(!state.assetOverview)state.assetOverview={};
  const data=state.assetOverview;
  const savingDefaults=['富邦帳戶','麗卉聯邦','志偉聯邦','Line Bank','手上現金','台新帳戶','元大銀行','玉山','大姊零用金餘額','二姊零用金餘額','共同存款','玉山外幣'];
  const debtDefaults=['公司','志偉','小孩-志偉','大社裝修','二姊','大姊'];
  if(!Array.isArray(data.savings))data.savings=savingDefaults.map(name=>({id:cryptoId(),name,amount:'',note:'',updatedAt:''}));
  if(!Array.isArray(data.debts))data.debts=debtDefaults.map(name=>({id:cryptoId(),name,amount:'',note:'',updatedAt:''}));
  data.savings.forEach(r=>{
    if(!r.id)r.id=cryptoId();
    if(r.amount===undefined)r.amount='';
    if(r.note===undefined)r.note='';
    if(r.updatedAt===undefined)r.updatedAt='';
  });
  const hasSavingName=(name)=>data.savings.some(r=>String(r.name||'').trim()===name);
  const addSavingAt=(name,idx)=>data.savings.splice(Math.max(0,Math.min(idx,data.savings.length)),0,{id:cryptoId(),name,amount:'',note:'',updatedAt:''});
  if(!hasSavingName('玉山')){
    const foreignIdx=data.savings.findIndex(r=>String(r.name||'').trim()==='玉山外幣');
    const commonIdx=data.savings.findIndex(r=>String(r.name||'').trim()==='共同存款');
    addSavingAt('玉山',foreignIdx>=0?foreignIdx:(commonIdx>=0?commonIdx:data.savings.length));
  }
  if(!hasSavingName('玉山外幣')){
    data.savings.push({id:cryptoId(),name:'玉山外幣',amount:'',note:'',updatedAt:''});
  }else{
    const foreignIdx=data.savings.findIndex(r=>String(r.name||'').trim()==='玉山外幣');
    if(foreignIdx>=0 && foreignIdx!==data.savings.length-1){
      const [foreignRow]=data.savings.splice(foreignIdx,1);
      data.savings.push(foreignRow);
    }
  }
  data.debts.forEach(r=>{if(!r.id)r.id=cryptoId();if(r.amount===undefined)r.amount='';if(r.note===undefined)r.note='';if(r.updatedAt===undefined)r.updatedAt='';});
  return data;
}
function assetNowText(){
  const d=new Date();
  const y=d.getFullYear()-1911;
  const pad=n=>String(n).padStart(2,'0');
  return `${y}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function calcAssetOverview(){
  const data=ensureAssetOverview();
  const isCommonRow=(r)=>String(r.name||'').includes('共同存款');
  const isForeignRow=(r)=>/外幣|日幣|日元|JPY/i.test(String(r.name||'')+' '+String(r.note||''));
  const common=((data.savings||[]).find(isCommonRow)||{}).amount||0;
  const savingsTotal=(data.savings||[]).reduce((s,r)=>isForeignRow(r)?s:s+num(r.amount),0);
  const savingsForDue=(data.savings||[]).reduce((s,r)=>{
    if(isCommonRow(r)||isForeignRow(r))return s;
    return s+num(r.amount);
  },0);
  const debtsTotal=(data.debts||[]).reduce((s,r)=>s+num(r.amount),0);
  const due=savingsForDue+debtsTotal;
  const real=due-num(common);
  return {savingsTotal,savingsForDue,debtsTotal,common:num(common),due,real};
}

let assetDragState=null;
function assetDragStart(kind,i,ev){
  assetDragState={kind,from:i};
  if(ev&&ev.dataTransfer){
    ev.dataTransfer.effectAllowed='move';
    ev.dataTransfer.setData('text/plain',kind+':'+i);
  }
  const tr=ev&&ev.currentTarget;
  if(tr)tr.classList.add('asset-dragging');
}
function assetDragEnd(ev){
  document.querySelectorAll('.asset-dragging,.asset-drop-target').forEach(el=>el.classList.remove('asset-dragging','asset-drop-target'));
  assetDragState=null;
}
function assetDragOver(kind,i,ev){
  if(!assetDragState||assetDragState.kind!==kind)return;
  ev.preventDefault();
  if(ev.dataTransfer)ev.dataTransfer.dropEffect='move';
  document.querySelectorAll('.asset-drop-target').forEach(el=>el.classList.remove('asset-drop-target'));
  if(ev.currentTarget)ev.currentTarget.classList.add('asset-drop-target');
}
function assetDrop(kind,to,ev){
  ev.preventDefault();
  document.querySelectorAll('.asset-dragging,.asset-drop-target').forEach(el=>el.classList.remove('asset-dragging','asset-drop-target'));
  const data=ensureAssetOverview();
  const list=data[kind]||[];
  const from=assetDragState&&assetDragState.kind===kind?assetDragState.from:-1;
  assetDragState=null;
  if(from<0||from>=list.length||to<0||to>=list.length||from===to)return;
  const [row]=list.splice(from,1);
  list.splice(to,0,row);
  save();
  renderSummaryTable();
}

function ensureMonthlyBalanceManual(monthId){
  if(!state.monthlyBalanceManual)state.monthlyBalanceManual={};
  if(!state.monthlyBalanceManual[monthId])state.monthlyBalanceManual[monthId]={childExpense:''};
  const r=state.monthlyBalanceManual[monthId];
  if(r.childExpense===undefined)r.childExpense='';
  return r;
}
function calcMonthlyBalanceManual(monthId){
  const r=ensureMonthlyBalanceManual(monthId);
  const base=calcMonthlyBalanceData(monthId);
  const childExpense=num(r.childExpense);
  return {
    income:base.income,
    expense:base.expense,
    balance:base.balance,
    childExpense,
    finalBalance:base.balance-childExpense
  };
}

function bridgeDefaultPct(it,side){

function bridgePctValue(it,side){
  if(!it)return side==='lihui'?100:0;
  const key=side==='lihui'?'bridgeLihuiPct':'bridgeZhiweiPct';
  const raw=String(it[key]??'').trim();
  if(raw==='')return bridgeDefaultPct(it,side);
  const n=Number(raw.replace(/[％%]/g,'').replace(/，/g,'.'));
  if(!isFinite(n))return bridgeDefaultPct(it,side);
  return Math.max(0,Math.min(100,n));
}
function bridgeCleanPct(v){
  const raw=String(v==null?'':v).trim().replace(/[％%]/g,'').replace(/，/g,'.');
  if(raw==='')return '';
  const n=Number(raw);
  if(!isFinite(n))return '';
  const clamped=Math.max(0,Math.min(100,n));
  return String(Math.round(clamped*100)/100).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
}
function bridgeShareAmount(monthId,it,amount,side){

function parseMonthsDivisorFromText(text,fallback){
  const s=String(text||'');
  let m=s.match(/\*\s*(\d+)\s*(?:個)?月?/);
  if(m&&Number(m[1])>0)return Number(m[1]);
  m=s.match(/(\d{1,2})\s*[-~～至到]\s*(\d{1,2})\s*月/);
  if(m){
    const a=Number(m[1]),b=Number(m[2]);
    if(b>=a)return b-a+1;
  }
  m=s.match(/(\d+)\s*(?:個)?月/);
  if(m&&Number(m[1])>0)return Number(m[1]);
  return fallback||1;
}

function extractRocDateFromMainCardText(raw){
  const s=String(raw||'').trim();
  if(!s)return '';
  const direct=normalizeDate(s);
  if(direct)return direct;
  if(/尚未輸入|無帳單|免填/.test(s))return '';
  const cleaned=s.replace(/[年月.\-]/g,'/').replace(/日/g,'').replace(/\/+/g,'/');
  let m=cleaned.match(/(\d{2,4})\/(\d{1,2})\/(\d{1,2})/);
  if(m){
    const v=normalizeDate(`${m[1]}/${m[2]}/${m[3]}`);
    if(v)return v;
  }
  m=cleaned.match(/(?:^|\D)(\d{1,2})\/(\d{1,2})(?:\D|$)/);
  if(m){
    const v=normalizeDate(`${m[1]}/${m[2]}`);
    if(v)return v;
  }
  return '';
}

function normKey(s){return String(s||'').toLowerCase().replace(/[\s\-－_＿，,。\.、:：()（）\[\]]/g,'').slice(0,50)}
function guessCard(text,fallback){
  // 判斷順序很重要：先判斷「志偉聯邦銀行」，剩下只要有「聯邦」就歸到「麗卉聯邦」
  for(const [name,rx] of cardAliases){if(rx.test(text))return name}
  return fallback||'未分類信用卡'
}
function inferCategory(desc){
  const key=normKey(desc);
  if(state.categoryMemory[key])return state.categoryMemory[key];
  let best={score:0,cat:''};
  for(const k in state.categoryMemory){
    if(!k)continue;
    if((key.includes(k)&&k.length>=4)||(k.includes(key)&&key.length>=4))return state.categoryMemory[k];
    const set=new Set(k.split(''));
    let hit=0; key.split('').forEach(ch=>{if(set.has(ch))hit++});
    const score=hit/Math.max(key.length,k.length,1);
    if(score>best.score){best={score,cat:state.categoryMemory[k]}}
  }
  if(best.score>=0.62)return best.cat;
  const rules=[[/台電|電力|水費|瓦斯|天然氣|中華電信|遠傳|台灣大哥大|電信/i,'水電電話費'],[/丁丁|尿布|奶粉|小孩|藥局|藥妝/i,'小孩用品/藥局'],[/全聯|家樂福|愛買|大潤發|超市|市場/i,'生活用品/超市'],[/街口|悠遊付|linepay|全支付|橘子支付/i,'行動支付'],[/中油|台塑|加油|停車|etag/i,'交通/停車'],[/早餐|午餐|晚餐|便當|麥當勞|肯德基|星巴克|咖啡|餐/i,'外食'],[/momo|蝦皮|pchome|博客來|網購/i,'網購'],[/保險|健保|勞保/i,'保險/稅費'],[/三井|百貨|屈臣氏|寶雅/i,'購物']];
  for(const [rx,cat] of rules){if(rx.test(desc))return cat}
  return '未分類'
}
function parseCardLine(line,fallback){let raw=line.trim();if(!raw)return null;const parts=raw.split(/\t+/).map(x=>x.trim()).filter(Boolean);let card='',date1='',date2='',desc='',amount='';if(parts.length>=5){card=guessCard(parts[0],fallback);date1=normalizeDate(parts[1]);date2=normalizeDate(parts[2]);amount=signedMoney(parts[parts.length-1]);desc=parts.slice(3,-1).join(' ')}else if(parts.length===4){card=guessCard(raw,fallback);date1=normalizeDate(parts[0]);date2=normalizeDate(parts[1]);desc=parts[2];amount=signedMoney(parts[3])}else{const amtMatch=raw.match(/(-?\d[\d,]*)\s*$/);if(!amtMatch)return null;amount=signedMoney(amtMatch[1]);raw=raw.slice(0,amtMatch.index).trim();const dates=raw.match(/(?:\d{2,4}[\/\-.])?\d{1,2}[\/\-.]\d{1,2}/g)||[];date1=normalizeDate(dates[0]||'');date2=normalizeDate(dates[1]||'');desc=raw;dates.forEach(d=>{desc=desc.replace(d,'')});card=guessCard(raw,fallback)}if(!amount)return null;return {card,date1,date2,desc:desc.trim()||raw,category:inferCategory(desc),amount,note:''}}

()"></td><td><input class="money" inputmode="numeric" value="${esc(r.amount)}" oninput="this.value=signedMoney(this.value);tempCardPreview[${i}].amount=this.value" onchange="renderCardPreview()" onblur="renderCardPreview()"></td><td><button class="iconbtn del" onclick="tempCardPreview.splice(${i},1);renderCardPreview()">刪</button></td></tr>`).join('')}</tbody></table></div>`}
function cardDetailImportKey(d){return [String(d&&d.date1||''),String(d&&d.date2||''),normKey(d&&d.desc||''),String(numSigned(d&&d.amount)),normKey(d&&d.category||'')].join('|')}
function confirmCardPreview(auto=false){
  if(!tempCardPreview.length){
    if(!auto)alert('尚未產生預覽');
    return {ok:false,count:0,skipped:0,total:0};
  }
  const cards=cardItems();
  const touched=new Set();
  const keepCardMeta=new Map();
  let added=0, skipped=0, total=0;
  tempCardPreview.forEach(r=>{
    let it=cards.find(c=>c.label===r.card);
    if(!it){it=cards.find(c=>c.label==='未分類信用卡')||cards[0]}
    if(!it)return;
    if(!keepCardMeta.has(it.id))keepCardMeta.set(it.id,{date:it.date,noBill:it.noBill,dateType:it.dateType});
    const d={date1:r.date1,date2:r.date2,desc:r.desc,category:r.category,amount:r.amount,note:r.note||''};
    const key=cardDetailImportKey(d);
    const exists=new Set((it.subItems||[]).map(cardDetailImportKey));
    if(exists.has(key)){skipped++;return;}
    it.subItems.push(d);
    it.detailsHidden=true;
    touched.add(it.id);
    added++;
    total+=numSigned(r.amount);
    if(r.desc&&r.category)state.categoryMemory[normKey(r.desc)]=r.category;
  });
  cards.forEach(it=>{
    if(touched.has(it.id)){
      const keep=keepCardMeta.get(it.id);
      updateCardNoteFromDetails(it,true);
      // 防呆：確認新增只新增明細與分類備註，不覆蓋原本信用卡繳款日期/無帳單狀態。
      if(keep){it.date=keep.date;it.noBill=keep.noBill;it.dateType=keep.dateType;}
    }
  });
  tempCardPreview=[];
  save();
  render();
  if(!auto)alert('已新增到信用卡明細，分類小計已寫入備註欄；原本信用卡繳款日期已保留'+(skipped?'；已略過重複 '+skipped+' 筆':''));
  return {ok:true,count:added,skipped,total};
}

function renderQuickBankButtons(){return `<div class="quick-wrap">${state.bankQuickButtons.map((b,i)=>`<span class="quick-chip" draggable="true" ondragstart="startQuickBankDrag(event,${i})" ondragend="endQuickBankDrag()" ondragover="allowQuickBankDrop(event)" ondrop="dropQuickBankButton(event,${i})" title="拖曳排序"><button class="softbtn ${b.tone|| (b.type==='income'?'green':'rose')}" onclick="quickBankButton(${i})">${b.type==='income'?'＋':'-'}${esc(b.item)}${b.amount&&num(b.amount)?' '+fmt(b.amount,true):''}</button><button class="mini" onclick="editQuickBankButton(${i})">編</button><button class="mini del" onclick="deleteQuickBankButton(${i})">刪</button></span>`).join('')}<button class="softbtn purple quick-drop-last" ondragover="allowQuickBankDrop(event)" ondrop="dropQuickBankButton(event,state.bankQuickButtons.length)" onclick="addQuickBankButton()">＋新增快速按鈕</button></div>`}
function quickPost(type,item,amount){
  const dateEl=document.getElementById('post_date');
  const amountEl=document.getElementById('post_amount');
  const itemEl=document.getElementById('post_item');
  const noteEl=document.getElementById('post_note');
  if(!dateEl||!amountEl||!itemEl)return;
  const clean=moneyOnly(amount);
  clearAmountFieldError(amountEl);
  clearDateFieldError(dateEl);
  itemEl.value=item||'';
  amountEl.value=num(clean)?String(clean):'';
  if(noteEl&&!noteEl.value)noteEl.value='';
  const pending=document.getElementById('post_pending_type');
  if(pending)pending.value=type||'expense';
  const hint=document.getElementById('postPendingHint');
  if(hint){
    hint.textContent='已帶入「'+(item||'')+'」，請輸入日期與金額後，再按「'+(type==='income'?'＋收入':'-支出')+'」新增入列。';
    hint.classList.remove('hidden');
  }
  const st=document.getElementById('saveText');
  if(st)st.textContent='已帶入郵局快速項目，請輸入日期與金額後新增';
  if(!dateEl.value)dateEl.focus();
  else if(!amountEl.value)amountEl.focus();
}
function quickPostButton(i){const b=state.postQuickButtons[i];if(!b)return;quickPost(b.type,b.item,b.amount)}
function addQuickPostButton(){const item=prompt('快速按鈕名稱/項目：');if(!item)return;const amount=moneyOnly(prompt('金額（可空白，點選後再輸入）：','')||'');const type=confirm('這個按鈕是收入嗎？\n確定＝收入，取消＝支出')?'income':'expense';state.postQuickButtons.push({type,item,amount,tone:type==='income'?'green':'rose'});save();render()}
function editQuickPostButton(i){const b=state.postQuickButtons[i];if(!b)return;const item=prompt('修改項目名稱：',b.item);if(!item)return;const amount=moneyOnly(prompt('修改金額（可空白）：',b.amount||'')||'');const type=confirm('這個按鈕是收入嗎？\n確定＝收入，取消＝支出')?'income':'expense';b.item=item;b.amount=amount;b.type=type;b.tone=type==='income'?'green':'rose';save();render()}
function deleteQuickPostButton(i){const b=state.postQuickButtons[i];if(!b)return;if(!confirmAction('確定刪除快速按鈕「'+b.item+'」？'))return;state.postQuickButtons.splice(i,1);save();render()}
function startQuickPostDrag(e,i){postQuickDragIndex=i;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))}catch(err){}const chip=e.currentTarget.closest('.quick-chip');if(chip)setTimeout(()=>chip.classList.add('dragging'),0)}
function allowQuickPostDrop(e){e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(err){}}
function endQuickPostDrag(){document.querySelectorAll('.quick-chip.dragging').forEach(x=>x.classList.remove('dragging'));postQuickDragIndex=null}
function dropQuickPostButton(e,toIndex){e.preventDefault();const from=postQuickDragIndex!==null?postQuickDragIndex:Number(e.dataTransfer?.getData('text/plain'));if(!Number.isInteger(from)||from<0)return;moveQuickPostButton(from,toIndex)}
function moveQuickPostButton(from,to){const list=state.postQuickButtons||[];if(from<0||from>=list.length)return;if(to<0)to=0;if(to>list.length)to=list.length;if(from===to||from+1===to)return;const item=list.splice(from,1)[0];if(from<to)to--;list.splice(to,0,item);save();render()}
function renderQuickPostButtons(){const list=state.postQuickButtons||[];return `<div class="quick-wrap">${list.map((b,i)=>`<span class="quick-chip" draggable="true" ondragstart="startQuickPostDrag(event,${i})" ondragend="endQuickPostDrag()" ondragover="allowQuickPostDrop(event)" ondrop="dropQuickPostButton(event,${i})" title="拖曳排序"><button class="softbtn ${b.tone|| (b.type==='income'?'green':'rose')}" onclick="quickPostButton(${i})">${b.type==='income'?'＋':'-'}${esc(b.item)}${b.amount&&num(b.amount)?' '+fmt(b.amount,true):''}</button><button class="mini" onclick="editQuickPostButton(${i})">編</button><button class="mini del" onclick="deleteQuickPostButton(${i})">刪</button></span>`).join('')}<button class="softbtn purple quick-drop-last" ondragover="allowQuickPostDrop(event)" ondrop="dropQuickPostButton(event,(state.postQuickButtons||[]).length)" onclick="addQuickPostButton()">＋新增快速按鈕</button></div>`}

  const isPost=kind==='postOffice';const title=isPost?'郵局帳款':'台灣銀行帳款';const id=isPost?'post':'bank';const txs=getGlobalData()[kind].txs||[];const c=calcLedger(txs);

function renderLedgerForm(kind,id){
  const pendingHint=kind==='taiwanBank'?`<input type="hidden" id="bank_pending_type" value=""><div id="bankPendingHint" class="bank-pending-hint hidden"></div>`:(kind==='postOffice'?`<input type="hidden" id="post_pending_type" value=""><div id="postPendingHint" class="bank-pending-hint hidden"></div>`:'');

function renderLedgerTable(kind){
  const txs=getGlobalData()[kind].txs||[];
  if(!txs.length)return '<div class="empty">目前沒有明細</div>';
  const rows=sortDateNearToFarEntries(txs);
  const balances=ledgerBalanceMap(txs);
  return `<table class="ledger-table cashflow-table excel-copy-table" data-copy-kind="${kind}">
    <thead><tr><th>日期</th><th>收入</th><th>支出</th><th>餘額</th><th>備註</th><th></th></tr></thead>
    <tbody>${rows.map(({item:t,index:i})=>{
      const amount=num(t.amount);
      const income=t.type==='income'?moneyOnly(t.amount):'';
      const expense=t.type==='expense'?moneyOnly(t.amount):'';
      const bal=balances[i]||0;
      const amountErr=kind==='taiwanBank'&&!amount;
      return `<tr>
        <td class="cash-date"><input value="${esc(t.date)}" onchange="this.value=normalizeDateInput(this);if(!this.dataset.dateInvalid)setTx('${kind}',${i},'date',this.value)"></td>
        <td class="cash-income"><input inputmode="numeric" class="ledger-income-input amountinp ${amountErr&&t.type==='income'?'amount-error':''}" value="${esc(income)}" oninput="setLedgerSideAmount('${kind}',${i},'income',this)" onchange="render()"></td>
        <td class="cash-expense"><input inputmode="numeric" class="ledger-expense-input amountinp ${amountErr&&t.type==='expense'?'amount-error':''}" value="${esc(expense)}" oninput="setLedgerSideAmount('${kind}',${i},'expense',this)" onchange="render()"></td>
        <td class="cash-balance ${bal<0?'negative':''}">${fmt(bal,true)}</td>
        <td><div class="cash-note-wrap"><input value="${esc(t.item)}" placeholder="項目" oninput="setTx('${kind}',${i},'item',this.value)"><input class="note-sub" value="${esc(t.note)}" placeholder="備註" oninput="setTx('${kind}',${i},'note',this.value)"></div>${amountErr?'<div class="amount-error-msg">金額不能為 0</div>':''}</td>
        <td><div class="row-copy-actions"><button type="button" class="iconbtn copy" onclick="copyLedgerRowForExcel('${kind}',${i},this)" title="複製新增下一列">複</button><button class="iconbtn del" onclick="delTx('${kind}',${i})">刪</button></div></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}
function confirmAction(message){
  return confirm(String(message||'確定執行這個動作？')+'\n\n按「確定」才會執行；按「取消」不會變更。');
}
function cleanExcelCell(v){
  return String(v??'').replace(/\r?\n/g,' ').replace(/\t/g,' ').trim();
}
function rowsToTsv(rows){return rows.map(r=>r.map(cleanExcelCell).join('\t')).join('\\n')}
function setCopyFeedback(label,success=true){
  const st=document.getElementById('saveText');
  if(st)st.textContent=(success?'已複製：':'複製失敗，請手動複製：')+label;
  showCopyToast((success?'已複製：':'複製失敗：')+label);
}
function showCopyToast(text){
  let box=document.getElementById('copyToast');
  if(!box){
    box=document.createElement('div');
    box.id='copyToast';
    box.className='copy-toast';
    document.body.appendChild(box);
  }
  box.textContent=text;
  box.classList.add('show');
  clearTimeout(window._copyToastTimer);
  window._copyToastTimer=setTimeout(()=>box.classList.remove('show'),1350);
}
function flashCopyButton(btn,success=true){
  if(!btn)return;
  const old=btn.textContent;
  btn.textContent=success?'已複':'失敗';
  btn.classList.toggle('done',success);
  btn.disabled=true;
  setTimeout(()=>{btn.textContent=old||'複';btn.classList.remove('done');btn.disabled=false;},900);
}
function tryTextareaCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.left='12px';
  ta.style.top='12px';
  ta.style.width='2px';
  ta.style.height='2px';
  ta.style.opacity='0';
  ta.style.zIndex='-1';
  document.body.appendChild(ta);
  ta.focus({preventScroll:true});
  ta.select();
  ta.setSelectionRange(0,ta.value.length);
  let ok=false;
  try{ok=document.execCommand('copy')}catch(e){ok=false}
  document.body.removeChild(ta);
  return !!ok;
}
function showManualCopyBox(text,label){
  let box=document.getElementById('copyManualBox');
  if(box)box.remove();
  box=document.createElement('div');
  box.id='copyManualBox';
  box.className='copy-manual-box';
  box.innerHTML='<div class="copy-manual-head"><span>自動複製被瀏覽器擋住，請在下方按 Ctrl+C 複製：'+esc(label)+'</span><button type="button" onclick="document.getElementById(\'copyManualBox\').remove()">關閉</button></div><textarea></textarea>';
  document.body.appendChild(box);
  const ta=box.querySelector('textarea');
  ta.value=text;
  ta.focus();
  ta.select();
}
function copyRowsForExcel(rows,label,btn){
  if(!confirmAction('確定複製「'+label+'」的 EXCEL 格式？'))return;
  const text=rowsToTsv(rows);
  let ok=tryTextareaCopy(text);
  const finish=(success)=>{
    setCopyFeedback(label,success);
    flashCopyButton(btn,success);
    if(!success)showManualCopyBox(text,label);
  };
  if(ok){
    finish(true);
    return;
  }
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>finish(true)).catch(()=>finish(false));
  }else{
    finish(false);
  }
}
function ledgerBalanceMap(txs){
  const map={};
  let balance=0;
  (txs||[]).map((item,index)=>({item,index}))
    .sort((a,b)=>{
      const av=dateValue(a.item.date), bv=dateValue(b.item.date);
      if(av!==bv)return av-bv;
      return a.index-b.index;
    })
    .forEach(({item:t,index:i})=>{
      const amount=num(t.amount);
      balance += t.type==='income'?amount:-amount;
      map[i]=balance;
    });
  return map;
}
function setLedgerSideAmount(kind,i,type,el){
  const tx=getGlobalData()[kind].txs[i];
  if(!tx)return;
  const v=moneyOnly(el?.value||'');
  if(el)el.value=v;
  tx.type=type;
  tx.amount=v;
  if(el){
    const tr=el.closest('tr');
    const other=tr?.querySelector(type==='income'?'.ledger-expense-input':'.ledger-income-input');
    if(other)other.value='';
  }
  save();
}
function ledgerExcelRows(kind){
  const txs=getGlobalData()[kind].txs||[];
  const balances=ledgerBalanceMap(txs);
  const rows=[['日期','收入','支出','餘額','備註']];
  sortDateNearToFarEntries(txs).forEach(({item:t,index:i})=>{
    const amount=num(t.amount);
    const income=t.type==='income'?amount:'';
    const expense=t.type==='expense'?amount:'';
    const note=[t.item||'',t.note||''].filter(Boolean).join('｜');
    rows.push([t.date||'',income,expense,balances[i]||0,note]);
  });
  return rows;
}
function copyLedgerForExcel(kind,btn){
  copyRowsForExcel(ledgerExcelRows(kind),kind==='taiwanBank'?'台灣銀行帳款':'郵局帳款',btn);
}
function copyLedgerRowForExcel(kind,i,btn){
  const txs=getGlobalData()[kind].txs||[];
  const t=txs[i];
  if(!t)return;
  const label=kind==='taiwanBank'?'台灣銀行帳款':'郵局帳款';
  if(kind==='taiwanBank'&&!num(t.amount)){
    showBankInlineError('這筆台灣銀行帳款金額為 0 或空白，不能複製新增入列');
    return;
  }
  if(!confirmAction('確定複製新增這筆「'+(t.item||label)+'」到下一列？'))return;
  const copy={...t,id:cryptoId()};
  // 單列「複」改為複製新增下一列，不再只是複製到剪貼簿。
  // 日期相同時會插在原本資料後面，排序後仍會靠在一起。
  if(copy.date)copy._newTop=false;
  txs.splice(i+1,0,copy);
  save();
  if(btn){
    const old=btn.textContent;
    btn.textContent='已增';
    btn.classList.add('done');
    setTimeout(()=>{btn.textContent=old||'複';btn.classList.remove('done');},800);
  }
  showCopyToast(kind==='taiwanBank'?'已複製新增台灣銀行下一列':'已複製新增下一列');
  render();
}
function pettyBalanceMap(who,rows){
  const p=getGlobalData().taiwanBank.petty;
  const start=numSigned(who==='dajie'?p.dajieStart:p.erjieStart);
  const map=new Map();
  let balance=start;
  (rows||[]).slice().sort((a,b)=>{
    const av=dateValue(a.date), bv=dateValue(b.date);
    if(av!==bv)return av-bv;
    return 0;
  }).forEach(r=>{
    const amount=num(r.amount);
    balance += r.sign==='收入'?amount:-amount;
    map.set(r,balance);
  });
  return map;
}
function pettyExcelRows(who){
  const p=getGlobalData().taiwanBank.petty;
  const c=calcPetty();
  const isDajie=who==='dajie';
  const detailRows=sortPettyRowsNearToFar(isDajie?c.dajieRows:c.erjieRows);
  const balances=pettyBalanceMap(who,isDajie?c.dajieRows:c.erjieRows);
  const rows=[['日期','收入','支出','餘額','備註']];
  const start=numSigned(isDajie?p.dajieStart:p.erjieStart);
  if(start)rows.push(['',start,'',start,'期初餘額']);
  detailRows.forEach(r=>{
    if(r.type==='start')return;
    const amount=num(r.amount);
    const income=r.sign==='收入'?amount:'';
    const expense=r.sign==='扣款'?amount:'';
    const note=[r.item||'',pettyNoteDisplay(r.note||'',r.originalAmount||r.amount)].filter(Boolean).join('｜');
    rows.push([r.date||'',income,expense,balances.get(r)||0,note]);
  });
  rows.push(['','','',isDajie?c.dajieEnd:c.erjieEnd,'試算餘額']);
  return rows;
}
function copyPettyForExcel(who,btn){
  copyRowsForExcel(pettyExcelRows(who),who==='dajie'?'大姊零用金明細':'二姊零用金明細',btn);
}
function copyAllPettyForExcel(btn){
  const rows=[['大姊零用金明細'],...pettyExcelRows('dajie'),[],['二姊零用金明細'],...pettyExcelRows('erjie')];
  copyRowsForExcel(rows,'姊妹零用金',btn);
}
function setTx(kind,i,field,val){
  const tx=getGlobalData()[kind].txs[i];
  if(!tx)return;
  tx[field]=field==='amount'?moneyOnly(val):val;
  if(field==='date'&&val)tx._newTop=false;
  save();
  // 不在 oninput 時 render，避免台灣銀行帳款一次只能輸入一個字元。
  // 日期變更時才重整，讓排序更新。
  if(field==='date')render();
}
function delTx(kind,i){if(!confirmAction('確定刪除此明細？'))return;getGlobalData()[kind].txs.splice(i,1);save();render()}
function renderBank(){
  const c=calcLedger(getGlobalData().taiwanBank.txs||[]);
  document.getElementById('main').innerHTML=`<div class="panel alt"><div class="panel-title"><div><h2>台灣銀行帳款</h2></div><div class="copy-excel-actions"><button type="button" class="softbtn blue" onclick="copyLedgerForExcel('taiwanBank',this)">複製EXCEL格式</button><span class="tag bal ${c.balance<0?'negative':''}">餘 ${fmt(c.balance,true)}</span></div></div>${renderQuickBankButtons()}<div id="bankInlineError" class="bank-inline-error hidden"></div>${renderLedgerForm('taiwanBank','bank')}${renderLedgerTable('taiwanBank')}</div>`
}
function setPetty(field,val,rerender=false){
  getGlobalData().taiwanBank.petty[field]=field.includes('StartNote')?val:(field.includes('Start')?signedMoney(val):(field.includes('Income')?moneyOnly(val):val));
  save();
  if(rerender)render();
}
function addPettyTx(who,type){
  const p=getGlobalData().taiwanBank.petty;
  const prefix=who==='dajie'?'dajie':'erjie';
  const dateEl=document.getElementById(prefix+'_date');
  const date=normalizeDateInput(dateEl);
  if(dateEl?.dataset?.dateInvalid){dateEl.focus();return}
  const item=document.getElementById(prefix+'_item').value.trim()|| (type==='income'?'零用金收入':'零用金扣款');
  const amount=moneyOnly(document.getElementById(prefix+'_amount').value);
  const note=document.getElementById(prefix+'_note').value.trim();
  if(!amount)return alert('請輸入金額');
  p[prefix+'Txs'].push({id:cryptoId(),type,date,item,amount,note});
  save();render();
}
function addPettyCashflow(who){
  const p=getGlobalData().taiwanBank.petty;
  const prefix=who==='dajie'?'dajie':'erjie';
  const dateEl=document.getElementById(prefix+'_date');
  const date=normalizeDateInput(dateEl);
  if(dateEl?.dataset?.dateInvalid){dateEl.focus();return}
  const income=moneyOnly(document.getElementById(prefix+'_income')?.value||'');
  const expense=moneyOnly(document.getElementById(prefix+'_expense')?.value||'');
  const note=document.getElementById(prefix+'_note')?.value.trim()||'';
  if(!income&&!expense)return alert('請輸入收入或支出金額');
  if(income)p[prefix+'Txs'].push({id:cryptoId(),type:'income',date,item:'零用金收入',amount:income,note:normalizePettySplitNote(note,income)});
  if(expense)p[prefix+'Txs'].push({id:cryptoId(),type:'expense',date,item:'零用金支出',amount:expense,note:normalizePettySplitNote(note,expense)});
  save();render();
}
function setPettyTx(who,i,field,val){

function calcPetty(){
  const petty=getGlobalData().taiwanBank.petty;
  const dajieRows=[],erjieRows=[];let dajie=numSigned(petty.dajieStart),erjie=numSigned(petty.erjieStart);
  function add(rows,sign,date,item,amount,note='',manualIndex=null,type='auto',originalAmount=null){rows.push({sign,date,item,amount,note,manualIndex,type,originalAmount:originalAmount||amount});return amount}
  (petty.dajieTxs||[]).forEach((t,i)=>{const a=num(t.amount); if(!a)return; if(t.type==='income')dajie+=add(dajieRows,'收入',t.date,t.item,a,t.note,i,'manual',a); else dajie-=add(dajieRows,'扣款',t.date,t.item,a,t.note,i,'manual',a)});
  (petty.erjieTxs||[]).forEach((t,i)=>{const a=num(t.amount); if(!a)return; if(t.type==='income')erjie+=add(erjieRows,'收入',t.date,t.item,a,t.note,i,'manual',a); else erjie-=add(erjieRows,'扣款',t.date,t.item,a,t.note,i,'manual',a)});
  const seenAutoPetty=new Set();
  Object.keys(state.months||{}).sort().forEach(monthId=>{
    const month=state.months[monthId];
    const homeSec=month?.personal?.sections?.find(sec=>sec.title==='大社支出');
    (homeSec?.items||[]).forEach(it=>{
      if(isDadLivingItemLabel(it.label))return; // 爸爸生活費不扣大姊/二姊零用金，改由台灣銀行帳戶手動輸入
      if(String(it.label||'').includes('高雄翠屏路大樓管理費'))return; // 高雄翠屏路大樓管理費不列入大姊零用金扣款
      const a=num(it.amount);if(!a)return;const dt=it.date||'';
      const dp=dateParts(dt); if(!dp)return;
      const key=[it.label,dt,a,it.splitMode].join('|');
      if(seenAutoPetty.has(key))return;
      seenAutoPetty.add(key);

      if(it.splitMode==='2'){const v=Math.round(a/2);dajie-=add(dajieRows,'扣款',dt,it.label,v,pettyPlainAmount(a)+'分攤/2',null,'auto',a)}
      else if(it.splitMode==='3'){const v=Math.round(a/3);dajie-=add(dajieRows,'扣款',dt,it.label,v,pettyPlainAmount(a)+'分攤/3',null,'auto',a);erjie-=add(erjieRows,'扣款',dt,it.label,v,pettyPlainAmount(a)+'分攤/3',null,'auto',a)}
    });
  });
  return {dajieRows,erjieRows,dajieEnd:dajie,erjieEnd:erjie}
}

function getDadLivingMissingMonths(rows,startMonth){
  const start=parseMonthId(startMonth)||parseMonthId(DAD_LIVING_START_MONTH);
  const end=parseMonthId(defaultMonth)||parseMonthId(monthIdFromDate(new Date()));
  const used=new Set((rows||[]).map(r=>dateParts(r.date)?.monthId).filter(Boolean));
  const out=[];let y=start.y,m=start.m;
  while(y<end.y||(y===end.y&&m<=end.m)){
    const id=`${y}-${String(m).padStart(2,'0')}`;
    if(!used.has(id))out.push(`${y-1911}/${m}`);
    m++;if(m>12){m=1;y++;}
  }
  return out;
}
function parseMonthId(id){const m=String(id||'').match(/^(\d{4})-(\d{1,2})$/);if(!m)return null;const year=+m[1], month=+m[2];return {year,month,y:year,m:month}}
function monthIdFromDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function copyDadLivingTableForExcel(btn){

    return [r.date||'',r.laiya||'',r.liling||'',r.lihui||'',r.note||'',`合計${total} 差額${diff}`];
  });
  const text=[['匯款日期','麗雅','麗玲','麗卉','備註','合計判斷'],...rows].map(r=>r.join('\t')).join('\\n');
  copyTextToClipboard(text,btn,'已複製爸生活費表格');
}

function loadSupabaseSettings(){const s=getSupabaseSettings();const u=document.getElementById('supabaseUrl'),k=document.getElementById('supabaseKey'),p=document.getElementById('supabasePanel');if(u)u.value=s.url||'';if(k)k.value=s.key||'';if(p&&s.panelOpen)p.classList.remove('hidden');updateSupabaseStatus(supaConnected?'已連線':'未連線',supaConnected?'ok':'off',s.lastSyncAt||'')}
function autoConnectSupabase(){const s=getSupabaseSettings();if(!s.url||!s.key)return;let tries=0;const run=()=>{tries++;const u=document.getElementById('supabaseUrl'),k=document.getElementById('supabaseKey');if(u)u.value=s.url||'';if(k)k.value=s.key||'';if(window.supabase&&window.supabase.createClient){setSyncMsg('正在自動連線...');connectSupabase();}else if(tries<15){setTimeout(run,300);}else{updateSupabaseStatus('未連線','off');setSyncMsg('Supabase 函式庫尚未載入，請確認網路後按連線。')}};setTimeout(run,250)}

function refreshCardPasteCloudStatus(detail){

  else setCardPasteCloudStatus('雲端未連線','off',detail||'目前會先存在本機；主畫面連線後再同步');

function updateSupabaseStatus(text,mode='off',last=''){const el=document.getElementById('syncStatus');if(el){el.textContent=text;el.className='sync-pill '+mode}const lastEl=document.getElementById('syncLast');if(lastEl){const s=getSupabaseSettings();lastEl.textContent='最後同步時間：'+(last||s.lastSyncAt||'—')}}
function toggleSupabasePanel(){const p=document.getElementById('supabasePanel');if(!p)return;p.classList.toggle('hidden');saveSupabaseSettings()}
function initSupabaseClient(){const url=document.getElementById('supabaseUrl')?.value.trim()||'';const key=document.getElementById('supabaseKey')?.value.trim()||'';if(!url||!key){alert('請先輸入 Supabase Project URL 和 Publishable Key');return null}if(!window.supabase||!window.supabase.createClient){alert('Supabase 函式庫尚未載入，請確認網路連線後再試一次。');return null}saveSupabaseSettings();supaClient=window.supabase.createClient(url,key);return supaClient}
async function connectSupabase(){
  const client=initSupabaseClient();
  if(!client)return;
  updateSupabaseStatus('連線中','warn');
  setSyncMsg('正在讀取雲端資料；開啟頁面不會自動上傳本機資料...');
  try{
    const {data,error}=await client.from(SUPA_TABLE).select('payload,updated_at').eq('workspace_key',SUPA_WORKSPACE).maybeSingle();
    if(error)throw error;
    supaConnected=true;
    if(supaPollTimer)clearInterval(supaPollTimer);
    supaPollTimer=setInterval(checkSupabaseRemote,9000);

    // V196：開啟/連線只讀取雲端，不因本機較新或資料較多就自動上傳，避免舊電腦覆蓋最新雲端資料。
    if(data&&data.payload){
      const remoteAt=data.updated_at||'';
      backupStateSnapshot('before-cloud-load-on-connect');
      supaApplyingRemote=true;
      applySupabasePayload(data.payload,remoteAt);
      supaApplyingRemote=false;
      ensureMonth();
      render();
      markSupabaseSynced(remoteAt,'已載入雲端最新資料；開啟本機不會自動上傳覆蓋雲端。');
    }else{
      supaLastRemoteAt='';
      updateSupabaseStatus('已連線','ok');
      setSyncMsg('雲端目前沒有資料；不會自動上傳本機。請確認資料正確後再開始修改，修改後才會上傳。');
      refreshCardPasteCloudStatus('雲端目前沒有資料；本機修改後才會建立雲端資料');
    }
  }catch(err){
    console.error(err);
    supaConnected=false;
    updateSupabaseStatus('連線失敗','warn');
    setSyncMsg('請確認資料表/RLS/URL/Key：'+(err.message||err));
  }
}
function markSupabaseSynced(remoteAt,msg){
  const now=new Date();
  const txt=now.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const s=getSupabaseSettings();
  localStorage.setItem(SUPA_STORE,JSON.stringify({...s,lastSyncAt:txt,lastRemoteAt:remoteAt||s.lastRemoteAt||''}));
  supaLastRemoteAt=remoteAt||supaLastRemoteAt||new Date().toISOString();
  supaLastCloudLoadedAt=supaLastRemoteAt;
  updateSupabaseStatus(supaConnected?'已連線':'未連線',supaConnected?'ok':'off',txt);
  setSyncMsg(msg||'已同步');
  const m=String(msg||'');
  if(m.includes('載入')||m.includes('收到')||m.includes('雲端最新')){
    setCardPasteCloudStatus('已載入雲端資料','ok','目前以雲端最新資料為準；只有修改後才會上傳');
  }else{
    setCardPasteCloudStatus('已完成雲端上傳','ok','另開視窗資料已同步到 Supabase');
  }
}
function disconnectSupabase(){supaConnected=false;supaClient=null;if(supaPollTimer)clearInterval(supaPollTimer);supaPollTimer=null;if(supaSaveTimer)clearTimeout(supaSaveTimer);supaSaveTimer=null;updateSupabaseStatus('未連線','off');setSyncMsg('已中斷');setCardPasteCloudStatus('雲端未連線','off','已中斷 Supabase 連線')}
function scheduleSupabaseSave(){
  if(!supaConnected||!supaClient||supaApplyingRemote)return;
  if(supaSaveTimer)clearTimeout(supaSaveTimer);
  setCardPasteCloudStatus('等待雲端上傳','warn','資料已在這台電腦修改，準備上傳前會先比對雲端時間');
  setSyncMsg('已偵測到本機修改，等待上傳雲端...');
  supaSaveTimer=setTimeout(()=>uploadToSupabase(false),1200);
}
async function fetchSupabaseRemoteState(){
  if(!supaClient)return null;
  const {data,error}=await supaClient.from(SUPA_TABLE).select('payload,updated_at').eq('workspace_key',SUPA_WORKSPACE).maybeSingle();
  if(error)throw error;
  return data||null;
}
function remoteIsNewerThanKnown(remoteAt){
  if(!remoteAt)return false;
  if(!supaLastRemoteAt)return true;
  const r=new Date(remoteAt).getTime();
  const k=new Date(supaLastRemoteAt).getTime();
  if(!Number.isFinite(r)||!Number.isFinite(k))return true;
  return r>k+1000;
}
function applyRemoteBecauseNewer(payload,remoteAt,msg){
  backupStateSnapshot('before-newer-cloud-apply');
  supaApplyingRemote=true;
  applySupabasePayload(payload,remoteAt);
  supaApplyingRemote=false;
  ensureMonth();
  render();
  markSupabaseSynced(remoteAt,msg||'雲端資料比本機新，已停止上傳並載入雲端最新資料。');
}
async function uploadToSupabase(manual=false){
  if(!supaConnected||!supaClient){
    if(manual)alert('尚未連線 Supabase');
    setCardPasteCloudStatus('雲端未連線','off','已先存在本機；連線後會先讀雲端，不會自動覆蓋雲端');
    return;
  }
  try{
    setCardPasteCloudStatus('比對雲端時間','warn','上傳前先確認雲端是否比本機更新');
    const remote=await fetchSupabaseRemoteState();
    if(remote&&remote.payload&&remoteIsNewerThanKnown(remote.updated_at)){
      applyRemoteBecauseNewer(remote.payload,remote.updated_at,'雲端資料比這台電腦新，已停止上傳並載入雲端最新資料，避免舊資料覆蓋。');
      return;
    }
    setCardPasteCloudStatus('正在上傳雲端','warn','正在把目前修改後的資料上傳 Supabase');
    if(!state._meta)state._meta={};
    const nowIso=new Date().toISOString();
    state._meta.localUpdatedAt=nowIso;
    state._meta.lastUserSavedAt=nowIso;
    state._meta.lastUploadBaseRemoteAt=supaLastRemoteAt||'';
    const payload=buildSupabasePayload();
    const {data,error}=await supaClient.from(SUPA_TABLE).upsert({workspace_key:SUPA_WORKSPACE,payload,updated_at:new Date().toISOString()},{onConflict:'workspace_key'}).select('updated_at').single();
    if(error)throw error;
    markSupabaseSynced(data?.updated_at,'已同步到雲端');
  }catch(err){
    console.error(err);
    updateSupabaseStatus('同步失敗','warn');
    setSyncMsg(err.message||String(err));
    setCardPasteCloudStatus('雲端上傳失敗','off',err.message||String(err));
  }
}
async function checkSupabaseRemote(){
  if(!supaConnected||!supaClient)return;
  try{
    const data=await fetchSupabaseRemoteState();
    if(!data||!data.payload)return;
    if(!remoteIsNewerThanKnown(data.updated_at))return;
    if(supaSaveTimer){
      clearTimeout(supaSaveTimer);
      supaSaveTimer=null;
      applyRemoteBecauseNewer(data.payload,data.updated_at,'雲端已經有另一台電腦的新資料，已停止本機待上傳並載入雲端。');
      return;
    }
    applyRemoteBecauseNewer(data.payload,data.updated_at,'已收到另一台電腦的最新更新。');
  }catch(err){
    console.error(err);
    updateSupabaseStatus('同步異常','warn');
    setSyncMsg(err.message||String(err));
  }
}
async function manualSyncSupabase(){
  if(!supaConnected){
    const client=initSupabaseClient();
    if(!client)return;
    supaClient=client;
    supaConnected=true;
  }
  updateSupabaseStatus('同步中','warn');
  setSyncMsg('手動同步：先讀取雲端最新資料，不自動上傳本機。');
  try{
    const data=await fetchSupabaseRemoteState();
    if(data&&data.payload){
      applyRemoteBecauseNewer(data.payload,data.updated_at,'已手動載入雲端最新資料。');
    }else{
      updateSupabaseStatus('已連線','ok');
      setSyncMsg('雲端目前沒有資料；不會自動上傳本機，請修改資料後再由自動存檔上傳。');
    }
  }catch(err){
    console.error(err);
    updateSupabaseStatus('同步失敗','warn');
    setSyncMsg(err.message||String(err));
  }
}

const PRINT_LABEL_STORE='lihui_monthly_print_label_overrides_v1';
let printLabelOverrides={};
try{printLabelOverrides=JSON.parse(localStorage.getItem(PRINT_LABEL_STORE)||'{}')}catch(e){printLabelOverrides={}}

function printNum(v){
  if(v===null||v===undefined||String(v).trim()==='')return 0;
  const n=Number(String(v).replace(/[,，$＄\s]/g,''));
  return Number.isFinite(n)?n:0;
}
function printMoney(v,forceZero=false){
  if(v===null||v===undefined||String(v).trim()==='')return forceZero?'$0':'';
  const n=Number(String(v).replace(/[,，$＄\s]/g,''));
  if(!Number.isFinite(n))return forceZero?'$0':'';
  return (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
}
function printCardTotal(item){
  if(item&&Array.isArray(item.subItems)&&item.subItems.length){
    return item.subItems.reduce((s,d)=>s+printNum(d.amount),0);
  }
  return printNum(item&&item.amount);
}
function printCleanNote(note){
  let s=String(note||'').trim();

  // 列印時不要顯示「由○○項目紀錄帶入：」這段固定文字，
  // 但要保留後面的項目內容與說明。
  // 例：由「0982-508-091」項目紀錄帶入：115 年 2 月綜合帳單｜115/01/20-115/02/19
  // 會列印成：115 年 2 月綜合帳單｜115/01/20-115/02/19
  s=s.replace(/^由「[^」]+」項目紀錄帶入：\s*/,'');
  s=s.replace(/由「[^」]+」項目紀錄帶入：\s*/g,'');

  return s.trim();
}
function printSortKey(item){
  const d=String(item&&item.date||'').trim();
  const m=d.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(!m)return 99999999;
  let y=Number(m[1]); if(y<300)y+=1911;
  return y*10000+Number(m[2])*100+Number(m[3]);
}
function printGetSections(){
  const secs=((getMonth().personal||{}).sections||[]);
  const out={};
  secs.forEach(sec=>{
    const t=sec.title||'';
    if(t.includes('收入'))out['收入']=sec;

function printItemKey(sectionTitle,item){

}
function printDisplayLabel(sectionTitle,item){

  return printLabelOverrides[key]!==undefined?printLabelOverrides[key]:String(item.label||'');

function printNoteWeight(text){
  const s=String(text||'').trim();
  if(!s)return 0;
  if(s.includes('\n'))return s.split('\n').length*18;
  let weight=0;
  for(const ch of s){weight += /[\u4e00-\u9fff\uff00-\uffef]/.test(ch)?1:.55;}
  return weight;
}
function printIsShortNote(text){
  const s=String(text||'').trim();
  if(!s)return true;
  if(s.includes('\n'))return s.split('\n').length<=1;
  return printNoteWeight(s)<=18;
}
function printIsLongNote(text){
  const s=String(text||'').trim();
  if(!s)return false;
  if(s.includes('\n'))return s.split('\n').length>=3;
  return printNoteWeight(s)>30;
}
function printEstimateNoteLines(text){
  const s=String(text||'').trim();
  if(!s)return 1;
  if(s.includes('\n'))return Math.min(4, Math.max(1, s.split('\n').length));
  const w=printNoteWeight(s);
  if(w<=18)return 1;
  if(w<=36)return 2;
  if(w<=54)return 3;
  return 4;
}
function printRowHeightByLines(lines){
  // V46：先以 3 行高度作為穩定基準，再由 tunePrintHeights 依一頁高度自動縮放。
  if(lines<=1)return 9.2;
  if(lines===2)return 10.4;
  if(lines===3)return 11.4;
  return 13.0;
}
function printBuildRows(sectionTitle,sec,isCard){
  const items=[...(((sec||{}).items)||[])].sort((a,b)=>printSortKey(a)-printSortKey(b));
  return items.map(it=>{
    const date=String(it.date||'').trim();
    const dateType=date?String(it.dateType||''):'';
    let note=printCleanNote(it.note);
    const amount=isCard?printMoney(printCardTotal(it),true):printMoney(it.amount,true);
    const label=printDisplayLabel(sectionTitle,it);

    // 列印：信用卡無帳單要在備註欄顯示「無帳單」
    if(isCard && it.noBill && !note) note='無帳單';

    // 列印：大社支出在備註欄顯示分攤/2 或 分攤/3；高雄翠屏路房貸不顯示
    if(sectionTitle==='大社' && !String(it.label||'').includes('高雄翠屏路房貸')){
      if(it.splitMode==='2' || it.splitMode==='3'){
        const splitText='分攤/'+it.splitMode;
        note = note ? (note+'｜'+splitText) : splitText;
      }
    }

    const lines=printEstimateNoteLines(note);
    const baseH=printRowHeightByLines(lines);
    const noteCls=lines>=3?' pv-long-note':(lines<=1?' pv-short-note':' pv-mid-note');
    return `<tr class="pv-row${noteCls}" data-lines="${lines}" style="--pv-this-row-h:${baseH}mm">
      <td class="pv-item">${esc(label)}</td>
      <td class="pv-amount">${esc(amount)}</td>
      <td class="pv-datetype">${esc(dateType)}</td>
      <td class="pv-date">${esc(date)}</td>
      <td class="pv-note">${esc(note)}</td>
    </tr>`;
  });
}

function tunePrintHeights(){
  const pv=document.getElementById('printView');
  const page=pv&&pv.querySelector('.pv-page');
  if(!pv||!page)return;

  const boxes=[...page.querySelectorAll('.pv-box')];
  const rows=[...page.querySelectorAll('tr.pv-row')];
  if(rows.length===0)return;

  /*
    V46：三行高度基準 + 一頁內自動平衡。
    先讓每列接近 3 行高度，看起來穩定；
    如果該月份列數多，會整體等比例縮短列高，保證不超過第 2 頁。
  */
  const pageH=280;       // V47：更保守，避免 P.2 只剩表頭
  const pagePad=1.6;
  const titleH=7.2;
  const gapH=Math.max(0, boxes.length-1)*0.45;
  const boxHeaderH=boxes.length*4.95;
  const tableHeaderH=boxes.length*4.0;
  const borderSafe=boxes.length*1.35;
  const available=pageH-pagePad-titleH-gapH-boxHeaderH-tableHeaderH-borderSafe;

  const rowInfos=rows.map(row=>{
    const lines=Number(row.dataset.lines||1);
    const base=printRowHeightByLines(lines);
    const minH=lines<=1 ? 4.3 : (lines===2 ? 5.8 : 7.0);
    return {row, lines, base, h:base, minH};
  });

  const baseTotal=rowInfos.reduce((s,r)=>s+r.base,0);
  let factor=baseTotal>0 ? Math.min(1, available/baseTotal) : 1;

  // 若資料少，保留三行基準，不硬撐到過高。
  // 若資料多，比例縮短，避免 P.2。
  rowInfos.forEach(r=>{
    r.h=Math.max(r.minH, r.base*factor);
    r.row.style.setProperty('--pv-this-row-h', r.h.toFixed(2)+'mm');
  });

  const pxPerMm=96/25.4;
  const maxPx=280*pxPerMm;
  for(let i=0;i<4;i++){
    if(page.scrollHeight<=maxPx)break;
    const f=Math.max(0.78, maxPx/page.scrollHeight);
    rowInfos.forEach(r=>{
      r.h=Math.max(r.minH, r.h*f);
      r.row.style.setProperty('--pv-this-row-h', r.h.toFixed(2)+'mm');
    });
  }
}

/* V129：信用卡刷卡紀錄總欄｜請款日期完成、尚未新增銀行、首頁提醒修正 */
function cardPasteBankToItemLabel(bank){
  const map={
    '台新':'台新信用卡',
    '富邦':'富邦銀行',
    '志偉聯邦':'志偉聯邦銀行',
    '麗卉聯邦':'麗卉聯邦',
    '中信':'中信linepay',
    '國泰':'國泰',
    '玉山':'玉山 PI信用卡',
    '星展':'星展現金回饋卡',
    '凱基':'凱基-丁丁藥局',
    '永豐':'永豐信用卡三井',
    '新光':'新光銀行',
    '其他':'未分類信用卡'
  };
  return map[String(bank||'').trim()]||'未分類信用卡';
}
function cardPasteFullRocDate(shortDate,payDate){
  const d=String(shortDate||'').match(/^(\d{1,2})\/(\d{1,2})$/);
  const p=String(payDate||'').match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(!d)return String(shortDate||'');
  if(!p)return String(shortDate||'');
  let y=+p[1]; if(y>1911)y-=1911;
  const pm=+p[2], m=+d[1], day=+d[2];
  // 例如 1 月繳款但消費日是 12 月，通常是上一年度的帳單。
  if(m>pm && pm<=2)y-=1;
  return `${y}/${m}/${day}`;
}

function isCardPasteNoBillImportRow(r){
  return numSigned(r&&r.amount)===0 && /無帳單/.test(String((r&&r.item)||''));
}
function cardItemsForMonth(monthId){
  const m=(state&&state.months)?state.months[monthId]:null;
  if(!m)return [];
  const out=[];
  (((m.personal||{}).sections)||[]).forEach(sec=>{
    (sec.items||[]).forEach(it=>{if(it&&it.isCard)out.push(it);});
  });
  return out;
}
function findCardItemByPasteBank(bank,monthId){
  const label=cardPasteBankToItemLabel(bank);
  const cards=monthId?cardItemsForMonth(monthId):cardItems();
  return cards.find(c=>String(c.label||'').trim()===label)
    || cards.find(c=>String(c.label||'').includes(bank)||String(label||'').includes(String(c.label||'')))
    || cards.find(c=>String(c.label||'').trim()==='未分類信用卡')
    || cards[0]
    || null;
}
function applyImportedCardPayDates(cardRows,targetMonthRaw,opts){
  const options=opts||{};
  let count=0;
  (cardRows||[]).forEach(r=>{
    const monthId=normalizeMonth(targetMonthRaw || (r&&r.belongMonth) || state.activeMonth);
    if(!monthId || !state.months || !state.months[monthId])return;
    const payDate=cleanMainCardPayDateText(r&&r.payDate);
    if(!payDate)return;
    const it=findCardItemByPasteBank(String(r&&r.bank||''),monthId);
    if(!it)return;
    const keepDate=cleanMainCardPayDateText(it.date);
    // V199：信用卡繳款日期以每月帳務主表已填寫為主；主表空白時，才用另開視窗刷卡明細的繳款日期補入。
    // 不限定歸屬麗卉；但只補日期，不因非麗卉明細改動無帳單狀態。
    if(keepDate){
      if(keepDate!==String(it.date||'').trim())it.date=keepDate;
      return;
    }
    it.date=payDate;
    if(options.clearNoBillOnRealCharge && !isCardPasteNoBillImportRow(r)){
      it.noBill=false;
    }
    count++;
  });
  return count;
}
function applyImportedNoBillRows(noBillRows,targetId){
  const monthText=rocMonthLabel(targetId);
  const noteText=monthText+'無帳單$0';
  let count=0;
  (noBillRows||[]).forEach(r=>{
    const it=findCardItemByPasteBank(String(r&&r.bank||''));
    if(!it)return;
    const keepDate=it.date;
    const keepDateType=it.dateType;
    it.noBill=true;
    it.subItems=[];
    it.amount='';
    it.note=noteText;
    it._autoNote='';
    it.detailsHidden=true;
    // 保留原本主表已輸入的信用卡繳款日期；只有原本空白且總欄有日期時才帶入。
    it.date=keepDate || cleanMainCardPayDateText(r&&r.payDate);
    it.dateType=keepDateType || it.dateType;
    count++;
  });
  return count;
}
function importLihuiCardRowsFromPaste(cardRows,targetMonthRaw){
  try{
    const allRows=(cardRows||[]);
    const targetId=normalizeMonth(targetMonthRaw || (allRows[0]&&allRows[0].belongMonth) || state.activeMonth);
    if(!targetId)return {ok:false,msg:'歸屬年月格式錯誤'};
    if(!state.months[targetId])state.months[targetId]=makeMonth();
    state.activeMonth=targetId;
    state.activeTab='personal';
    ensureMonth();

    // V199：繳款日期不看歸屬誰。即使該月沒有歸屬「麗卉」的刷卡明細，
    // 只要另開視窗有同月同銀行的繳款日期，且每月帳務主表日期空白，就補回主表。
    const payDateRows=allRows.filter(r=>String(r&&r.bank||'').trim() && cleanMainCardPayDateText(r&&r.payDate));
    const rowHasShare=r=>!!(r&&(String(r.lihuiPct||'').trim()!==''||String(r.zhiweiPct||'').trim()!==''));
    const pctVal=v=>{const n=Number(String(v==null?'':v).replace(/[％%]/g,'').replace(/，/g,'.'));return isFinite(n)?Math.max(0,Math.min(100,n)):0};
    const rowNoMonthly=r=>!!(r&&(r.noMonthly===true||String(r.noMonthly).toLowerCase()==='true'));
    const rowLihuiAmount=r=>{
      if(rowNoMonthly(r))return 0;
      const amount=numSigned(r&&r.amount);
      if(rowHasShare(r))return Math.round(amount*pctVal(r.lihuiPct)/100);
      return String((r&&r.payer)||'').trim()==='麗卉負擔'?amount:0;
    };
    const sourceRows=allRows.filter(r=>rowLihuiAmount(r) || isCardPasteNoBillImportRow(r));
    const noBillRows=sourceRows.filter(isCardPasteNoBillImportRow);
    const rows=sourceRows.filter(r=>!isCardPasteNoBillImportRow(r) && rowLihuiAmount(r));
    if(!rows.length && !noBillRows.length && !payDateRows.length)return {ok:false,msg:'沒有可帶入的麗卉負擔刷卡資料、無帳單資料或信用卡繳款日期'};

    const noBillCount=applyImportedNoBillRows(noBillRows,targetId);
    const payDateCount=applyImportedCardPayDates(payDateRows,targetId,{clearNoBillOnRealCharge:false});
    tempCardPreview=rows.map(r=>({
      card:cardPasteBankToItemLabel(r.bank),
      date1:cardPasteFullRocDate(r.spendDate,r.payDate),
      date2:cardPasteFullRocDate(r.postDate,r.payDate),
      desc:String(r.item||''),
      category:inferCategory(String(r.item||'')),
      amount:signedMoney(String(rowLihuiAmount(r)||'')),
      note:(String(r.note||'')+(r.noMonthly?'｜不帶入每月帳務':''))
    }));
    save();
    render();
    renderCardPreview();
    const total=tempCardPreview.reduce((s,r)=>s+numSigned(r.amount),0);
    return {ok:true,count:tempCardPreview.length,total,preview:!!tempCardPreview.length,noBillCount,payDateCount};
  }catch(err){
    return {ok:false,msg:err&&err.message?err.message:String(err)};
  }
}window.importLihuiCardRowsFromPaste=importLihuiCardRowsFromPaste;

function importCurrentMonthCardPasteRecords(){
  try{

    const raw=localStorage.getItem(key);
    const all=raw?JSON.parse(raw):[];

    const target=normalizeMonth(state.activeMonth);

    const res=importLihuiCardRowsFromPaste(list,target);
    if(res&&res.ok){
      let inserted={count:0,skipped:0,total:0};
      if(res.preview)inserted=confirmCardPreview(true);

      if(inserted.count)parts.push('已新增麗卉負擔明細 '+inserted.count+' 筆，合計 '+fmtSigned(inserted.total,true));

      if(inserted.skipped)parts.push('略過重複 '+inserted.skipped+' 筆');

    else alert((res&&res.msg)||'帶入失敗');
  }catch(err){
    alert('帶入失敗：'+(err&&err.message?err.message:err));
  }
}

function notifyCardPasteChanged(){
  try{

  function normalizeRocDateValue(raw,baseRocYear){
    let s=String(raw||'').trim().replace(/[年月.\-]/g,'/').replace(/日/g,'').replace(/\/+/g,'/');
    if(!s)return {ok:false,value:'',msg:'請輸入日期'};
    let y,m,d;
    let parts=s.split('/').filter(Boolean);
    if(parts.length===2){y=baseRocYear||currentRocYear();m=+parts[0];d=+parts[1];}
    else if(parts.length===3){y=+parts[0];if(y>1911)y-=1911;m=+parts[1];d=+parts[2];}
    else return {ok:false,value:s,msg:'日期格式錯誤'};
    const gy=y+1911;
    const dt=new Date(gy,m-1,d);
    if(dt.getFullYear()!==gy||dt.getMonth()!==m-1||dt.getDate()!==d)return {ok:false,value:s,msg:'日期不存在'};
    return {ok:true,value:y+'/'+m+'/'+d,y,m,d};
  }
  function normalizeRocMonthValue(raw){
    let s=String(raw||'').trim().replace(/[年月.\-]/g,'/').replace(/月/g,'').replace(/\/+/g,'/');
    if(!s)return {ok:false,value:'',msg:'請輸入歸屬年月'};
    let y,m;
    const parts=s.split('/').filter(Boolean);
    if(parts.length===1){y=currentRocYear();m=+parts[0];}
    else if(parts.length>=2){y=+parts[0];if(y>1911)y-=1911;m=+parts[1];}
    else return {ok:false,value:s,msg:'年月格式錯誤'};
    if(!y||!m||m<1||m>12)return {ok:false,value:s,msg:'年月格式錯誤'};
    return {ok:true,value:y+'/'+m,y,m};
  }
  function rocMonthText(v){const r=normalizeRocMonthValue(v);return r.ok?(r.y+'年'+r.m+'月'):String(v||'');}
  function compactDate(d){const r=normalizeRocDateValue(d,'');if(!r.ok)return '';return String(r.y)+String(r.m).padStart(2,'0')+String(r.d).padStart(2,'0');}
  function bankCell(r){return String(r.bank||'')+compactDate(r.payDate||'');}
  function uniqueList(arr){return arr.filter((v,i,a)=>v&&a.indexOf(v)===i);}
  function stripLeadingItemPrefix(s,prefix){
    let out=String(s||'').trim();
    const p=String(prefix||'').trim();
    if(!p)return out;
    const re=new RegExp('^\\s*'+escReg(p)+'\\s*[｜|,，:：\\-－]*\\s*');
    let next=out.replace(re,'').trim();
    while(next!==out){out=next;next=out.replace(re,'').trim();}
    return out;
  }
  function stripClaimTextFromItem(s,r){
    let out=String(s||'').trim();
    const month=normalizeRocMonthValue((r&&r.belongMonth)||'').value;
    const owner=String((r&&r.owner)||'').trim();
    const c=(claimStatus[month]&&claimStatus[month][owner])?claimStatus[month][owner]:null;
    const notes=[];
    if(c&&String(c.note||'').trim())notes.push(String(c.note||'').trim());
    if(c&&String(c.date||'').trim()){
      notes.push('請款完成 '+String(c.date||'').trim());
      notes.push('已請款 '+String(c.date||'').trim());
    }
    uniqueList(notes).forEach(n=>{
      const p=escReg(n);
      out=out.replace(new RegExp('\\s*[｜|]\\s*'+p+'\\s*$'),'').trim();
      out=out.replace(new RegExp('^\\s*'+p+'\\s*[｜|]\\s*'),'').trim();
    });
    return out;
  }
  function cleanCardPasteItemValue(item,r){

    const paySlash=pay.ok?pay.value:'';
    const payCompact=pay.ok?(String(pay.y)+String(pay.m).padStart(2,'0')+String(pay.d).padStart(2,'0')):compactDate((r&&r.payDate)||'');
    uniqueList([
      bankCell(r),
      bank+payCompact,
      bank+' '+payCompact,
      bank+'｜'+payCompact,
      bank+paySlash,
      bank+' '+paySlash,

    return s||original;
  }
  function itemDisplay(r){return cleanCardPasteItemValue((r&&r.item)||'',r);}
  function isZeroBillRow(r){return moneyNum(r&&r.amount)===0 && /無帳單/.test(String((r&&r.item)||''));}

  function cleanPct(v){

  function rowHasCustomShare(r){

    if(ltxt==='' && ztxt==='')return false;
    // 舊資料有些被帶成 0 / 0；沒有新版標記、也沒有舊負擔人時，視為舊資料未填，不強迫100%。
    if(!String(r.shareVersion||'').trim() && !String((r&&r.payer)||'').trim() && pctValue(ltxt)===0 && pctValue(ztxt)===0)return false;

  }
  function rowLegacyPayer(r){return String((r&&r.payer)||'').trim();}
  function isV207NewShareRequired(r){
    if(!r || isZeroBillRow(r))return false;
    if(String(r.shareVersion||'').trim())return true;
    const owner=String((r&&r.owner)||'').trim();
    const m=normalizeRocMonthValue((r&&r.belongMonth)||'');

    return !!(m.ok && m.y===115 && m.m===6 && !owner);
  }
  function rowShareManaged(r){if(shareLockedRow(r))return false;return !!(r && (isV207NewShareRequired(r) || rowHasCustomShare(r) || rowLegacyPayer(r)));}
  function rowLihuiPct(r){
    if(isZeroBillRow(r)||shareLockedRow(r))return 0;

  function rowZhiweiPct(r){

  function rowShareAmount(r,side){

  function rowShareTotalPct(r){return rowLihuiPct(r)+rowZhiweiPct(r);}
  function shareMissing(r){

  function rowPayer(r){

  function burdenDisplay(r){

  function applyDefaultShareForOwner(obj){

  function ruleKey(v){
    let s=String(v||'');
    try{s=s.normalize('NFKC');}catch(e){}
    return s.trim().toLowerCase()
      .replace(/[\s　]+/g,'')
      .replace(/[＊*・·．.，,。:：|｜/\\\-－_＿$＄()（）\[\]【】{}]/g,'');
  }
  function saveShareRules(){writeJson(SHARE_RULE_KEY,shareRules);}
  function findItemShareRule(item){
    const k=ruleKey(item);
    if(!k)return null;
    const candidates=(shareRules||[]).filter(r=>{
      const rk=ruleKey(r.keyword);
      if(!rk)return false;
      return k.includes(rk) || (rk.length>=4 && rk.includes(k));
    });
    candidates.sort((a,b)=>ruleKey(b.keyword).length-ruleKey(a.keyword).length);
    return candidates[0]||null;
  }
  function applyItemRuleToRow(obj,force){
    if(!obj || isZeroBillRow(obj))return false;
    const rule=findItemShareRule(obj.item);
    if(!rule)return false;

    if(shareLockedRow(obj)){clearShareForLockedOwner(obj);obj.noMonthly=!!rule.noMonthly;return true;}
    if(force || (!rowHasCustomShare(obj) && !rowLegacyPayer(obj))){
      obj.lihuiPct=cleanPct(rule.lihuiPct);
      obj.zhiweiPct=cleanPct(rule.zhiweiPct);
      obj.noMonthly=!!rule.noMonthly;
      obj.payer=rowLihuiPct(obj)>0 && rowZhiweiPct(obj)<=0?'麗卉負擔':(rowZhiweiPct(obj)>0 && rowLihuiPct(obj)<=0?'志偉負擔':'');

  }
